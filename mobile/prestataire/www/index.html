function agenda(){const L=S.reqs.filter(r=>['confirmee','aconfirmer','encours','acceptee'].includes(r.st));return `<div class="card"><b>Horaires de travail</b><div class="mu">Lun–Sam · 08:00 – 18:00 · Dimanche : congé</div></div>`+(L.map(r=>`<div class="card row" onclick="reqD(${r.id})"><div class="av" style="border-radius:12px;font-size:12px">${r.slot.split(' ')[0]}</div><div><b>${esc(r.title)}</b><div class="mu">${r.slot} · ${esc(r.client)}</div></div></div>`).join('')||'<div class="card mu">Aucun rendez-vous à venir.</div>')}
function setSt(id,st){const r=S.reqs.find(x=>x.id==id);r.st=st;if(st=='terminee'){const net=Math.round(r.price*(1-COMM));S.wallet.tx.unshift({id:Date.now(),l:`${r.title} — ${r.client}`,a:net,t:'credit',d:'Auj.',gross:r.price,comm:r.price-net,cat:r.type||'Autre',mo:new Date().getMonth()})}save();toast(ST[st][0]);main()}
const NX={attente:['Accepter','acceptee'],acceptee:['Envoyer la confirmation','aconfirmer'],aconfirmer:['Client confirmé','confirmee'],confirmee:['Démarrer','encours'],encours:['Terminer','terminee']};

 modal(`<div class="row"><div class="av" style="width:48px;height:48px">${ini(r.client)}</div><div style="flex:1"><b style="font-size:17px">${esc(r.client)}</b><div style="color:${STC[r.st]};font-size:12px;font-weight:700">${s[0]}</div></div><button class="ib" style="background:var(--or);border:0" onclick="toast('Appel : disponible avec le backend')">📞</button></div><div class="kvs">${[['📅','Date',r.slot],['📍','Lieu',esc(r.city)],['🛠️','Service',esc(r.title)],['📝','Détails',esc(r.desc)],['💵','Montant total',money(r.price)],['🏷️','Commission '+COMM*100+'%',money(r.price-net)],['✅','Vous recevez',money(net)]].map(x=>`<div class="kv2"><span>${x[0]} ${x[1]}</span><b>${x[2]}</b></div>`).join('')}</div>
 <div class="row" style="margin-top:14px">${open?`<button class="btn o" onclick="setSt(${id},'${r.st=='attente'?'refusee':'annulee'}');cm()">${r.st=='attente'?'Refuser':'Annuler'}</button>`:''}${n?`<button class="btn" onclick="setSt(${id},'${n[1]}');cm()">${n[0]}</button>`:`<button class="btn g" onclick="cm()">Fermer</button>`}</div>
 <div class="row" style="margin-top:8px"><button class="btn g s" style="flex:1" onclick="cm();openChat(${(S.convs.find(c=>c.name==r.client)||{}).id||newConv(r.client)})">💬 Écrire</button>${r.st=='attente'?`<button class="btn g s" style="flex:1" onclick="propose(${id})">Autre créneau</button>`:''}</div>`)}

function newConv(n){const id=Date.now();S.convs.push({id,name:n,role:'Client',msgs:[],un:0});save();return id}
let cq='',cf='tous';
function chat(){const F=[['tous','Tous'],['nl','Non lus'+(unread()?' ('+unread()+')':'')],['cl','Clients'],['su','Support'],['arc','Archivés']];
 $('#v').innerHTML=`<div class="top"><h2 style="font-size:26px">Chats</h2><button class="ib" aria-label="Nouvelle conversation" onclick="newC()">＋</button><button class="ib" onclick="toast('Conversations à jour')">⟳</button></div><div class="body" style="padding:0 16px"><div class="zs" style="margin:0 0 10px">🔍<input placeholder="Rechercher" value="${esc(cq)}" oninput="cq=this.value;cl()"></div><div class="chips" style="flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none">${F.map(x=>`<span class="chip ${cf==x[0]?'on':''}" style="white-space:nowrap" onclick="cf='${x[0]}';chat()">${x[1]}</span>`).join('')}</div><div id="cl"></div></div>`;cl()}

function wal(){const tx=S.wallet.tx,cr=tx.filter(t=>t.a>0),mth=new Date().getMonth(),PAL=['#ff6a13','#ff9a3d','#ffd0a0','#b43c00','#6b6b78'];
 const M=Array.from({length:mth+1},(_,i)=>cr.filter(t=>(t.mo==null?mth:t.mo)==i).reduce((a,t)=>a+t.a,0));
 const mx=Math.max(...M,1),W=320,H=140,B=H-24,X=i=>10+i*(W-20)/Math.max(M.length-1,1),Y=v=>B-(v/mx)*(H-66),pt=M.map((v,i)=>[+X(i).toFixed(1),+Y(v).toFixed(1)]);
 let d='M'+pt[0].join(' ');for(let i=1;i<pt.length;i++){const m=((pt[i-1][0]+pt[i][0])/2).toFixed(1);d+=`C${m} ${pt[i-1][1]},${m} ${pt[i][1]},${pt[i][0]} ${pt[i][1]}`}
 const mi=M.indexOf(Math.max(...M)),mp=pt[mi],tw=86,tx0=Math.min(Math.max(mp[0]-tw/2,0),W-tw);
 const G={};cr.forEach(t=>{const k=t.cat||'Autre';G[k]=G[k]||{n:0,s:0};G[k].n++;G[k].s+=t.a});const ks=Object.keys(G).sort((a,b)=>G[b].s-G[a].s),tn=ks.reduce((a,k)=>a+G[k].n,0),tot=ks.reduce((a,k)=>a+G[k].s,0);
 $('#v').innerHTML=`<div class="top"><button class="ib" aria-label="Menu" onclick="menu()">☰</button><h2 style="text-align:center">Rapports de revenus</h2><button class="ib" onclick="toast('Recherche : bientôt disponible')">🔍</button></div><div class="body" style="padding-top:4px">
 <div class="card row sp"><div><div class="mu">Solde disponible</div><b style="font-size:21px;color:var(--or)">${money(bal())}</b></div><button class="btn s" onclick="withdraw()">Retirer</button></div>
 <div class="rp"><b>Tendance des revenus</b><svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:8px;overflow:visible"><defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff6a13" stop-opacity=".4"/><stop offset="1" stop-color="#ff6a13" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(i=>`<line x1="0" x2="${W}" y1="${B-i*(H-66)/3}" y2="${B-i*(H-66)/3}" stroke="#26262b" stroke-dasharray="3 4"/>`).join('')}<path d="${d}L${pt[pt.length-1][0]} ${B}L${pt[0][0]} ${B}Z" fill="url(#wg)"/><path d="${d}" fill="none" stroke="#ff6a13" stroke-width="2.4" stroke-linecap="round"/><line x1="${mp[0]}" x2="${mp[0]}" y1="${mp[1]}" y2="${B}" stroke="#ff6a1366" stroke-dasharray="3 3"/><circle cx="${mp[0]}" cy="${mp[1]}" r="4.5" fill="#000" stroke="#ff6a13" stroke-width="2.4"/><g transform="translate(${tx0},${Math.max(mp[1]-34,0)})"><rect width="${tw}" height="22" rx="7" fill="#ff6a13"/><text x="${tw/2}" y="15" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">${money(M[mi])}</text></g>${M.map((v,i)=>`<text x="${pt[i][0]}" y="${H-6}" fill="#6b6b78" font-size="9" text-anchor="middle">${MN[i]}</text>`).join('')}</svg></div>
 <div class="rp"><b>Revenus par type de service</b><table><tr><th>Type</th><th>Prest.</th><th>Revenu net</th></tr>${ks.map((k,i)=>`<tr><td><span class="dot2" style="background:${PAL[i%5]}"></span>${esc(k)}</td><td>${G[k].n}</td><td>${money(G[k].s)}</td></tr>`).join('')||'<tr><td colspan="3" class="mu">Aucune prestation payée pour le moment.</td></tr>'}<tr style="border-top:1px solid var(--ln)"><td><b>Total</b></td><td><b>${tn}</b></td><td><b>${money(tot)}</b></td></tr></table><div class="mu" style="margin-top:6px;font-size:11.5px">Net après commission Ouvrage (${COMM*100}%).</div></div>
 ${ks.length?`<div class="rp"><b>Performance par service</b><div class="stk">${ks.map((k,i)=>`<div style="flex:${G[k].s};background:${PAL[i%5]}">${Math.round(G[k].s/tot*100)}%</div>`).join('')}</div><div class="row" style="flex-wrap:wrap;gap:4px 12px;margin-top:8px">${ks.map((k,i)=>`<span class="mu" style="font-size:11px"><span class="dot2" style="background:${PAL[i%5]}"></span>${esc(k)}</span>`).join('')}</div></div>`:''}
 <h3 style="margin-bottom:10px">Historique</h3>${tx.slice(0,12).map(t=>`<div class="card row sp"><div><b>${esc(t.l)}</b><div class="mu">${t.d}${t.s?' · '+t.s:''}</div></div><b style="color:${t.a>0?'var(--ok)':'var(--ko)'}">${t.a>0?'+':''}${money(t.a)}</b></div>`).join('')||'<div class="card mu">Aucune transaction.</div>'}<p class="mu">Prototype : les flux réels passent par l'agrégateur de paiement.</p></div>`}
function withdraw(){modal(`<h3>Retrait</h3><p class="mu" style="margin:4px 0 10px">Disponible : ${money(bal())}</p><label>Montant (${CUR.code})</label><input id="wa" type="number"><label>Moyen</label><select id="wm"><option>Orange Money</option><option>MTN MoMo</option><option>Moov Money</option><option>Wave</option><option>Virement bancaire</option></select><label>Numéro / compte</label><input id="wn" placeholder="07 00 00 00 00"><button class="btn" onclick="doW()">Confirmer le retrait</button>`)}

 const it=(i,t,s2,fn)=>`<div class="pr" onclick="${fn}"><span class="pi">${i}</span><div style="flex:1"><b style="font-size:14px">${t}</b><div class="ps">${s2}</div></div><span class="pc">›</span></div>`;

function photo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,400/Math.min(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.8);S.user.photo=d;if(S.users[S.user.e])S.users[S.user.e].photo=d;save();me()};im.src=r.result};r.readAsDataURL(f)}

 sub('Métiers & tarifs',`<div class="card"><b>Mes métiers</b><div class="chips" style="margin:8px 0 0">${u.subs.map(chip).join('')||'<span class="mu">Aucun métier choisi</span>'}</div></div><h3 style="margin:6px 0 10px">Tous les métiers</h3>${Object.entries(CATS).map(([c,l])=>`<div class="card"><b>${CI[c]} ${c}</b><div class="chips" style="margin:8px 0 0">${(c=='Autres métiers'?S.custom:l).map(chip).join('')||'<span class="mu">Ajoutez votre métier ci-dessous</span>'}</div></div>`).join('')}<div class="row"><input id="nt" placeholder="Ajouter un autre métier" style="margin:0"><button class="btn s" onclick="addT()">Ajouter</button></div><br><label>Tarif de base (${CUR.code})</label><input id="tf" type="number" value="${(u.tarif||0)/Math.pow(10,CUR.dec)}"><label>Zones d'intervention</label><input id="zn" value="${esc(u.zone||u.city||'')}"><label>Horaires</label><input value="Lun–Sam 08:00–18:00"><button class="btn" onclick="S.user.tarif=Math.round(+$('#tf').value*Math.pow(10,CUR.dec));S.user.zone=$('#zn').value;sv();toast('Enregistré');main()">Enregistrer</button>`)}

/* ---------- Vérification ---------- */
function verif(){const v=S.ver,st={attente:['En attente de validation','t-wa'],valide:['Validé','t-ok'],refuse:['Refusé','t-ko'],complement:['Complément demandé','t-bl']}[v.st]||['En attente de validation','t-wa'];
 const f=(k,l)=>`<div class="card row sp"><div><b>${l}</b><div class="mu">${v[k]?'✔ '+esc(v[k]):'Non fourni'}</div></div><label class="btn s g" style="width:auto">${v[k]?'Remplacer':'Envoyer'}<input type="file" hidden accept="image/*,.pdf" onchange="S.ver['${k}']=this.files[0]?.name||'';save();verif()"></label></div>`;
 sub('Vérification',`<div class="card row sp"><div><b>Statut</b><div class="mu">Pièces conservées dans un stockage privé chiffré.</div></div><span class="tag ${st[1]}">${st[0]}</span></div>${f('cni',"Carte d'identité (obligatoire)")}${f('naiss','Extrait de naissance (obligatoire)')}${f('diplome','Justificatif professionnel (facultatif)')}<p class="mu" style="margin:6px 0 12px">Votre profil n'est visible par les clients qu'après validation par l'administrateur.</p><button class="btn" onclick="if(!S.ver.cni||!S.ver.naiss)return toast('Carte d\\'identité et extrait de naissance requis');S.ver.st='attente';save();toast('Dossier envoyé à l\\'administration');main()">Soumettre pour vérification</button>`)}

splash();
</script></body></html>
