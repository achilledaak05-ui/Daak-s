<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ouvrage</title><meta name="theme-color" content="#000">
<style>
:root{--bg:#000;--card:#101012;--card2:#1b1b1f;--tx:#f4f4f6;--mu:#9a9aa6;--or:#ff6a13;--or2:#ff9a3d;--ok:#2ecc71;--ko:#ff4d4f;--bl:#3b82f6;--ln:#26262b;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh}
body{background:#000;color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
#app{width:100%;max-width:440px;height:100%;position:relative;overflow:hidden;background:var(--bg)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;animation:in .28s ease;padding-top:env(safe-area-inset-top,0px)}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.body{flex:1;overflow-y:auto;padding:16px 16px 24px;scrollbar-width:none}.body::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px}.top h2{flex:1;font-size:17px;font-weight:700;letter-spacing:-.2px}
.ib{background:#ffffff0d;border:1px solid #ffffff14;color:var(--tx);width:40px;height:40px;border-radius:14px;font-size:18px;cursor:pointer;flex:none}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;letter-spacing:.1px;color:#fff;background:linear-gradient(135deg,var(--or),var(--or2));cursor:pointer;transition:transform .1s;box-shadow:inset 0 1px 0 #ffffff40,0 10px 24px -10px #ff6a13aa;margin-top:4px}
.btn:active{transform:scale(.97)}.btn.g{background:var(--card2);color:var(--tx);box-shadow:none}.btn.r{background:var(--ko);box-shadow:none}.btn.o{background:0;border:1.5px solid var(--or);color:var(--or);box-shadow:none}
.btn.s{width:auto;padding:9px 14px;font-size:13px}.btn.dm{background:transparent;border:1px dashed #ffffff40;color:var(--mu);box-shadow:none;font-weight:600}
input,select,textarea{width:100%;background:#121215;border:1px solid var(--ln);color:var(--tx);border-radius:14px;padding:13px;font:inherit;font-size:16px;margin-bottom:10px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--or);box-shadow:0 0 0 3px #ff6a1330}
label{font-size:12px;color:var(--mu);display:block;margin:2px 0 4px}
.card,.rp,.bk,.pcard,.zw{background:linear-gradient(180deg,#151518,#0e0e10);border:1px solid #232328;border-radius:20px;box-shadow:inset 0 1px 0 #ffffff0a,0 12px 30px -20px #000}
.card{padding:14px;margin-bottom:12px}.bk{border-radius:20px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:13px}.ps{font-size:11.5px;color:var(--mu)}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px;font-size:13px}
.tag{font-size:11px;font-weight:700;letter-spacing:.3px;padding:3px 9px;border-radius:99px;background:var(--card2);white-space:nowrap}
.t-ok{background:#2ecc7122;color:var(--ok)}.t-wa{background:#ff6a1322;color:var(--or)}.t-ko{background:#ff4d4f22;color:var(--ko)}.t-bl{background:#3b82f622;color:var(--bl)}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--or),#b43c00);display:grid;place-items:center;font-weight:800;color:#fff;flex:none}

.nav button i{display:grid;place-items:center;margin-bottom:2px;font-style:normal}.nav button.on{color:var(--or);font-weight:700}
.nav button.on::before{content:"";position:absolute;top:-7px;left:50%;width:22px;height:3px;margin-left:-11px;border-radius:0 0 4px 4px;background:var(--or);box-shadow:0 2px 12px #ff6a13}

.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;border:0;background:0;color:var(--mu);padding:9px;border-radius:10px;font-weight:600;cursor:pointer}.seg .on{background:var(--or);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.chip{padding:8px 13px;border-radius:99px;background:var(--card2);border:1px solid var(--ln);font-size:13px;cursor:pointer}.chip.on{background:var(--or);border-color:var(--or);color:#fff;font-weight:600}
.zs{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:0 14px;margin:12px 0;cursor:pointer;color:var(--mu)}.zs input{border:0;background:0;margin:0;padding:13px 0;outline:0!important;box-shadow:none!important;color:var(--tx)}
.zb{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#ff6a13,#e0540a);border-radius:24px;padding:18px;color:#fff;margin-bottom:14px;box-shadow:0 18px 40px -18px #ff6a13aa}.zbtn{background:#fff;color:#c24a05;border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
.zg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 16px}.zt{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 2px;text-align:center;font-size:11px;cursor:pointer}
.zi{width:36px;height:36px;margin:0 auto 6px;border-radius:12px;background:#ff6a1326;display:grid;place-items:center;font-size:18px}.zi.sm{margin:0;flex:none}
.zl{color:var(--or);font-size:13px;cursor:pointer}.zr{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px;margin:10px 0;cursor:pointer;background:var(--card);border:1px solid var(--ln)}.zp{color:var(--or);font-weight:700;font-size:13px;margin-top:3px}
.pcard{border-radius:20px;padding:4px 14px;margin-bottom:14px}.pr{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln);cursor:pointer}.pr:last-child{border:0}
.pi{width:34px;height:34px;border-radius:10px;background:#ff6a1322;display:grid;place-items:center}.pc{color:#6b6b78;font-size:20px}
.pch{font-size:12px;padding:5px 11px;border-radius:99px;background:#ff6a1322;color:#ff9a3d;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px}.kv span{color:var(--mu)}
.kvs{margin-top:12px}.kv2{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:13px}.kv2 span{color:var(--mu);white-space:nowrap}.kv2 b{text-align:right}
.cr{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #ffffff14;cursor:pointer}.bd{background:var(--or);color:#fff;border-radius:99px;font-size:11px;min-width:20px;text-align:center;padding:1px 6px}
.ph{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.ph div{aspect-ratio:1;border-radius:12px;background:var(--card2) center/cover;position:relative}.ph span{position:absolute;bottom:4px;left:4px;background:#000a;color:#fff;padding:2px 6px;border-radius:6px;font-size:11px}
.sw{width:50px;height:28px;border-radius:99px;background:var(--card2);position:relative;cursor:pointer;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ok)}.sw.on::after{left:25px}
.bw{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:8px}.bw.r{align-items:flex-end}
.bub{max-width:78%;padding:9px 12px;border-radius:18px 18px 18px 5px;margin-bottom:6px;background:#1f1f23;color:var(--tx);animation:in .2s}
.bub.me{background:#e8751a;color:#fff;border-radius:18px 18px 5px 18px;margin-left:auto}
.bub img{max-width:100%;border-radius:10px;display:block;margin-bottom:4px}.bub small{display:block;font-size:10px;opacity:.7;text-align:right}
.dsep{text-align:center;color:#6b6b78;font-size:11px;margin:4px 0 12px}
.ipill{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:99px;margin:8px 12px calc(10px + env(safe-area-inset-bottom,0px));padding:4px 8px;color:var(--tx)}
.ipill input{border:0;background:0;margin:0;padding:10px;outline:0!important;box-shadow:none!important;color:inherit}.ic{background:0;border:0;color:var(--mu);font-size:18px;cursor:pointer;padding:6px}
.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:13px;z-index:50;animation:in .2s;white-space:nowrap;box-shadow:0 10px 30px -8px #000;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.mod{position:absolute;inset:0;background:#000b;z-index:30;display:flex;align-items:flex-end}.mod>div{background:var(--bg);width:100%;border-radius:22px 22px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .25s}
.stars{color:#ffb020}
.pch,.tag{vertical-align:middle}
.ob{position:absolute;inset:0;overflow:hidden;color:#f4f4f6;background:radial-gradient(ellipse 100% 40% at 50% 100%,rgba(255,106,19,.5),transparent 72%),radial-gradient(ellipse 80% 30% at 50% 0,rgba(110,48,10,.35),transparent 70%),#070504}
.obg{position:absolute;left:8%;right:8%;opacity:.95;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.obt{position:absolute;left:0;right:0;bottom:0;padding:20px 22px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.obt h1{font-size:25px;line-height:1.2;font-weight:700;letter-spacing:-.3px}.obt h1 span{color:#f4a261}.obt p{font-size:12.5px;color:#b9a99b}
.wm{letter-spacing:5px;font-weight:800;font-size:12px;color:#f4a261}
.ob-b{display:flex;align-items:center;justify-content:center;gap:9px;height:48px;border-radius:12px;font:600 14px system-ui,sans-serif;color:#fff;border:1px solid rgba(255,255,255,.1);cursor:pointer;background:rgba(255,255,255,.07)}
.ob-b.or{background:linear-gradient(180deg,#f58a47,#d9601a);border-color:#ffb27a55;box-shadow:0 8px 24px -8px #ff6a1388}
.lnk{text-align:center;font-size:11px;color:#8d7e72}.lnk b{color:#e8dccf}
.glow{position:absolute;left:50%;top:34%;width:560px;height:560px;margin-left:-280px;border-radius:50%;background:#050403;box-shadow:0 -3px 0 -1px #ffd2a8,0 -8px 26px 2px #ff7a22,0 -26px 80px 14px rgba(255,106,19,.5)}
/* Design « Ouvrage » : cartes sombres, hero orange, liste blanche, pills */
.logo{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,var(--or),#c24a05);display:grid;place-items:center;box-shadow:0 18px 40px -10px #ff6a13cc,inset 0 1px 0 #ffffff44;margin:0 auto}
.brand{text-align:center}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#ff8a2b,#ff6a13 55%,#d9500a);border-radius:24px;padding:18px;color:#fff;margin:10px 0 16px;box-shadow:0 18px 40px -18px #ff6a13aa;min-height:150px}
.hero h3{font-size:21px;line-height:1.15;font-weight:800;letter-spacing:-.3px}
.hero .wk{position:absolute;right:14px;bottom:14px;width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:center;border:3px solid #fff;box-shadow:0 10px 24px -8px #0008}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:linear-gradient(180deg,#151518,#0e0e10);border:1px solid #232328;border-radius:18px;padding:12px 2px 10px;text-align:center;font-size:11px;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff0a}
.tile i{display:grid;place-items:center;width:40px;height:40px;margin:0 auto 6px;border-radius:14px;background:#ff6a1320;color:var(--or);font-size:19px;font-style:normal}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px}.sec-h b{font-size:16px;letter-spacing:-.2px}.sec-h span{color:var(--or);font-size:13px;cursor:pointer;font-weight:600}
.wlist{background:#fff;color:#111;border-radius:22px;overflow:hidden;box-shadow:0 18px 40px -20px #000}
.wlist .wi{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid #ececf0;cursor:pointer;font-weight:600;font-size:15px}
.wlist .wi:last-child{border:0}
.wlist .wi i{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--or);display:grid;place-items:center;font-style:normal;font-size:17px;flex:none}
.wlist .wi .ch{margin-left:auto;color:#a0a0aa;font-size:20px}
.tabs2{display:flex;gap:8px;margin:6px 0 14px}.tabs2 button{flex:1;border-radius:99px;padding:9px 6px;background:var(--card);color:var(--mu);font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--ln)}.tabs2 button.on{background:var(--or);color:#fff;border-color:var(--or)}
.jc{background:linear-gradient(180deg,#151518,#0e0e10);border:1px solid #232328;border-radius:20px;padding:14px;margin-bottom:12px;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff0a,0 12px 30px -20px #000}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#ffffff14;border:1px solid #ffffff14;border-radius:20px;overflow:hidden;margin:4px 0 14px}
.feat div{background:#0b0b0d;padding:13px 8px;text-align:center;font-size:11px;color:var(--mu);line-height:1.3}
.feat b{display:block;color:var(--tx);font-size:12px;margin:4px 0 2px}
.feat i{color:var(--or);font-style:normal;font-size:18px}
.nav .np{flex:1;display:grid;place-items:center;background:0;border:0;cursor:pointer;padding:0}
.navp{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;display:grid;place-items:center;font-size:30px;line-height:1;margin-top:-26px;box-shadow:0 10px 24px -6px #ff6a13cc;border:4px solid #000}
.ob-logo{display:grid;place-items:center;flex-direction:column;position:absolute;left:0;right:0;top:20%;text-align:center}
/* Menu latéral et lien secondaire */
.menu{position:absolute;inset:0;z-index:20;display:flex}
.menu .pn{width:78%;background:var(--card);padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));animation:in .25s;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.menu .ov{flex:1;background:#000a}
.menu .it{padding:13px 10px;border-radius:12px;cursor:pointer;font-weight:600;font-size:14px}.menu .it:hover{background:var(--card2)}
.lk{background:0;border:0;color:#fff;font-size:14px;font-weight:600;cursor:pointer;padding:6px;text-align:center}
.stars-in{display:flex;gap:4px;margin:6px 0 4px}.stars-in button{background:0;border:0;font-size:34px;line-height:1;color:#3a3a42;cursor:pointer;padding:2px 4px;transition:transform .1s}.stars-in button.on{color:#ffb020}.stars-in button:active{transform:scale(.9)}
/* Accessibilité : focus clavier visible, animations réduites si demandées */
button:focus-visible,[role=switch]:focus-visible,[role=button]:focus-visible{outline:2px solid var(--or);outline-offset:2px}

/* Cadre de l'application sur grand écran */
@media(min-width:520px){
 body{align-items:center;background:radial-gradient(ellipse 60% 50% at 50% 100%,#ff6a1330,transparent 70%),#050506}
 #app{max-width:400px;height:min(840px,calc(100dvh - 48px));border-radius:46px;box-shadow:0 0 0 9px #101013,0 0 0 10px #34343b,0 50px 100px -20px #000,0 0 120px -30px #ff6a1366}
 #app::before{content:"";position:absolute;top:10px;left:50%;width:92px;height:26px;margin-left:-46px;border-radius:99px;background:#000;z-index:60;pointer-events:none}
 .scr{padding-top:40px}
}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
// Éléments [role=switch] et [role=button] activables au clavier (Entrée / Espace)
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=switch],[role=button]')){e.preventDefault();e.target.click()}});

/* ---------- Données de référence (démonstration) ---------- */
const CATS=[['Plomberie','🚰'],['Électricité','⚡'],['Menuiserie','🪚'],['Peinture','🎨'],['Maçonnerie','🧱'],['Climatisation','❄️'],['Nettoyage','🧽'],['Autres services','➕']];
const CITIES=['Abidjan','Bouaké','Yamoussoukro','San-Pédro','Korhogo','Daloa','Man'];
const PAY=['Wave','Orange Money','MTN Mobile Money','Moov Money','Carte Visa / Mastercard'];
const PROS=[]; // Aucun prestataire fictif : la liste se remplit avec les inscriptions réelles
const BST={attente:['En attente de confirmation','t-wa'],demande_devis:['Devis demandé','t-wa'],devis_propose:['Devis reçu','t-bl'],a_payer:['À payer','t-wa'],payee:['Payée','t-ok'],en_cours:['En cours','t-bl'],fin_signalee:['Fin à confirmer','t-wa'],terminee:['Terminée','t-ok'],annulee:['Annulée','t-ko'],refusee:['Refusée','t-ko'],litige:['Litige','t-ko']};
const ACTIVE=['attente','demande_devis','devis_propose','a_payer','payee','en_cours','fin_signalee','litige'];
const NEXT={attente:'Le prestataire doit confirmer la réservation.',demande_devis:'Le prestataire doit proposer un prix.',devis_propose:'Acceptez le devis pour passer au paiement.',a_payer:'Réglez la prestation pour la confirmer.',payee:'Le prestataire va démarrer les travaux.',en_cours:'Les travaux sont en cours.',fin_signalee:'Confirmez la bonne réalisation ou ouvrez un litige.',terminee:'Prestation terminée. Vous pouvez laisser un avis.',annulee:'Réservation annulée.',refusee:'Devis refusé.',litige:'Litige ouvert : l\'équipe Ouvrage vous contactera.'};
const MSG={a_payer:'Réservation confirmée : à payer',en_cours:'Les travaux ont commencé',fin_signalee:'Le prestataire a signalé la fin des travaux',terminee:'Prestation confirmée',litige:'Litige ouvert',refusee:'Devis refusé',annulee:'Réservation annulée'};
const BACK_RES="S.tab='res';main()",BACK_ME="S.tab='me';main()";

/* ---------- Utilitaires ---------- */
const money=m=>new Intl.NumberFormat('fr-FR').format(Math.round(m)).replace(/\s/g,' ')+' FCFA';
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const idKey=s=>s.trim().toLowerCase().replace(/\s/g,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini=n=>(n||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const time=()=>new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const today=()=>new Date().toLocaleDateString('fr-FR');
const rating=p=>{const r=RV(p);return r.length?r.reduce((a,x)=>a+x.s,0)/r.length:0};
const devisPrice=p=>Math.round(p.tarif*1.8/500)*500;
const phSvg=e=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2a22"/><stop offset="1" stop-color="#ff6a13"/></linearGradient></defs><rect width="200" height="140" fill="url(#g)"/><text x="100" y="92" font-size="60" text-anchor="middle">${e}</text></svg>`);

/* ---------- État ---------- */
const KEY='ouv-client';
const def=()=>({v:1,uid:null,users:{},tab:'home',q:'',cat:'',city:'',favs:[],reviews:{},bookings:[],tx:[],msgs:{support:[]},unread:{},notif:[]});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=def()}
if(S.v!==1)S=Object.assign(def(),{users:S.users||{}});
// Remise à zéro unique : suppression des anciennes données de démonstration
if(S.z!==1){S.favs=[];S.reviews={};S.bookings=[];S.tx=[];S.msgs={support:[]};S.unread={};S.notif=[];delete S.users.demo;if(S.uid==='demo')S.uid=null;S.z=1}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const U=()=>S.users[S.uid];
const RV=p=>S.reviews[p.id]||[];
const activeCount=()=>S.bookings.filter(b=>ACTIVE.includes(b.st)).length;
const unreadTotal=()=>Object.values(S.unread||{}).reduce((a,b)=>a+b,0);
function notify(t){S.notif.unshift({t,h:time()});S.notif=S.notif.slice(0,50);save()}
// Nouvelle session : données de démonstration, comptes conservés
function fresh(uid){const u=S.users;S=def();S.users=u;S.uid=uid;save();main()}

/* ---------- Interface commune ---------- */
function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;A.appendChild(e);setTimeout(()=>e.remove(),2200)}
function go(h){A.innerHTML=`<div class="scr">${h}</div>`}
function sub(t,body,back='main()'){go(`<div class="top"><button class="ib" aria-label="Retour" onclick="${back}">‹</button><h2>${t}</h2></div><div class="body">${body}</div>`)}
function modal(h){const m=document.createElement('div');m.className='mod';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.innerHTML=`<div>${h}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};A.appendChild(m);return m}
const cm=()=>{const m=$('.mod');m&&m.remove()};
function gpsT(el){const on=el.classList.toggle('on');el.setAttribute('aria-checked',on);if(on&&navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{const a=$('#ba');if(a)a.value=`Position GPS ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`},()=>toast('Position indisponible : saisissez l\'adresse'))}}

function tgl(el,k){S[k]=S[k]===false;save();el.classList.toggle('on',S[k]!==false);el.setAttribute('aria-checked',S[k]!==false)}

function r1(){const v=[1,2,3,4].map(i=>$('#a'+i).value.trim());if(v.some(x=>!x))return toast('Tous les champs sont requis');

function svcs(){sub('Tous les services',`<div class="wlist">${CATS.map((c,i)=>`<div class="wi" role="button" tabindex="0" onclick="catGo(${i})"><i>${c[1]}</i><span>${esc(c[0])}</span><span class="ch" aria-hidden="true">›</span></div>`).join('')}</div><p class="mu" style="margin-top:12px;text-align:center">Choisissez un métier pour voir les prestataires vérifiés de votre zone.</p>`)}
function catGo(i){S.cat=CATS[i][0];S.tab='search';save();main()}
function menu(){const u=U(),m=document.createElement('div');m.className='menu';
 const I=[['🏠','Accueil',"S.tab='home';save();main()"],['🧰','Services',"svcs()"],['📋','Mes réservations',"S.tab='res';save();main()"],['💬','Messages',"S.tab='chat';save();main()"],['♥','Favoris',"favsV()"],['💳','Paiements et reçus',"paysV()"],['🆘','Assistance',"support()"],['⚙️','Paramètres',"settings()"],['🚪','Déconnexion',"logout()"]];
 m.innerHTML=`<div class="pn" role="dialog" aria-label="Menu"><div class="row" style="margin-bottom:12px"><div class="av" style="width:48px;height:48px">${ini(u.n)}</div><div style="min-width:0"><b>${esc(u.n)}</b><div class="mu">${esc(u.city)}</div></div></div><hr style="border:0;border-top:1px solid var(--ln);margin:4px 0 8px">${I.map(i=>`<div class="it" role="button" tabindex="0" onclick="this.closest('.menu').remove();${i[2]}">${i[0]}&nbsp; ${i[1]}</div>`).join('')}</div><div class="ov" onclick="this.parentNode.remove()"></div>`;A.appendChild(m)}
function proCard(p){const r=rating(p);return `<div class="zr" role="button" tabindex="0" onclick="proView(${p.id})"><div class="av" style="width:48px;height:48px" aria-hidden="true">${ini(p.name)}</div><div style="flex:1;min-width:0"><div class="row"><b>${esc(p.name)}</b><span class="tag t-ok">✔ Vérifié</span></div><div class="mu">${esc(p.trade)} · ${esc(p.city)}</div><div class="mu"><span class="stars">★</span> ${RV(p).length?r.toFixed(1)+' ('+RV(p).length+' avis)':'Nouveau'}</div></div><div style="text-align:right"><div class="zp">dès ${money(p.tarif)}</div></div></div>`}

/* ---------- Recherche ---------- */
function search(){$('#v').innerHTML=`<div class="top"><h2 style="font-size:24px">Recherche</h2></div><div class="body" style="padding-top:0">
 <div class="zs" style="margin:0 0 10px">🔍<input id="sq" aria-label="Rechercher" placeholder="Métier, nom, ville…" value="${esc(S.q)}" oninput="S.q=this.value;save();list()"></div>
 <div class="chips" style="flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none">${['',...CATS.map(c=>c[0])].map(c=>`<span class="chip ${S.cat==c?'on':''}" style="white-space:nowrap" role="button" tabindex="0" onclick="S.cat='${c}';save();search()">${c||'Tous'}</span>`).join('')}</div>
 <label for="sc">Ville</label><select id="sc" onchange="S.city=this.value;save();list()"><option value="">Toute la Côte d'Ivoire</option>${CITIES.map(c=>`<option ${S.city==c?'selected':''}>${c}</option>`).join('')}</select>
 <div id="sl"></div></div>`;list()}
function list(){const q=S.q.toLowerCase().trim(),L=PROS.filter(p=>(!S.cat||p.trade==S.cat)&&(!S.city||p.city==S.city)&&(!q||[p.name,p.trade,p.city,p.zone,...p.skills].join(' ').toLowerCase().includes(q)));
 $('#sl').innerHTML=L.map(proCard).join('')||'<div class="card mu">Aucun prestataire ne correspond à votre recherche.</div>'}

/* ---------- Profil prestataire ---------- */
function proView(id){const p=PROS.find(x=>x.id==id),f=S.favs.includes(p.id),r=rating(p);
 sub('Prestataire',`<div class="card row"><div class="av" style="width:64px;height:64px;font-size:22px">${ini(p.name)}</div><div style="flex:1;min-width:0"><div class="row"><b style="font-size:17px">${esc(p.name)}</b></div><span class="tag t-ok">✔ Vérifié</span><div class="mu" style="margin-top:4px">${esc(p.trade)} · ${esc(p.zone)}, ${esc(p.city)}</div><div class="mu">${RV(p).length?'<span class="stars">★</span> '+r.toFixed(1)+' ('+RV(p).length+' avis)':'Nouveau prestataire'}</div></div></div>
 <div class="card"><div class="mu">Tarif de base</div><b style="font-size:17px;color:var(--or)">dès ${money(p.tarif)}</b><p style="margin-top:8px;font-size:13.5px">${esc(p.bio)}</p></div>
 <b>Compétences</b><div class="chips" style="margin:8px 0 14px">${p.skills.map(s=>`<span class="pch">${esc(s)}</span>`).join('')}</div>
 <b>Réalisations</b><div class="ph" style="margin:8px 0 14px">${p.ph.map((e,i)=>`<div style="background-image:url(${phSvg(e)})" role="img" aria-label="Réalisation ${i+1}"><span>Réal. ${i+1}</span></div>`).join('')}</div>
 <b>Avis clients</b>${RV(p).map(v=>`<div class="card" style="margin:8px 0 0"><div class="row sp"><b>${esc(v.n)}</b><span class="stars">${'★'.repeat(v.s)}</span></div><div class="mu" style="margin-top:4px">${esc(v.t)}</div></div>`).join('')||'<div class="card mu">Aucun avis pour le moment.</div>'}
 <div class="row" style="margin:14px 0 4px"><button class="btn g s" style="flex:1" aria-pressed="${f}" onclick="favT(${p.id})">${f?'♥ Favori':'♡ Ajouter aux favoris'}</button><button class="btn g s" style="flex:1" onclick="openChat(${p.id})">💬 Écrire</button></div>
 <button class="btn" onclick="book(${p.id},'immediat')">Réserver une intervention</button><button class="btn g" onclick="book(${p.id},'devis')">Demander un devis</button>`)}
function favT(id){const i=S.favs.indexOf(id);i<0?S.favs.push(id):S.favs.splice(i,1);save();proView(id)}

/* ---------- Réservation ---------- */
function book(pid,mode){const p=PROS.find(x=>x.id==pid),u=U();cm();
 modal(`<h3>${mode=='devis'?'Demande de devis':'Réservation immédiate'}</h3><p class="mu" style="margin:4px 0 12px">${esc(p.name)} · ${esc(p.trade)}</p>
 <label for="bs">Service</label><select id="bs">${p.skills.map(s=>`<option>${esc(s)}</option>`).join('')}</select>
 <label for="bd">Date et heure souhaitées</label><input id="bd" type="datetime-local">

 <div class="card row sp" style="padding:12px"><span>Partager ma position GPS</span><div class="sw ${u.gps?'on':''}" role="switch" tabindex="0" aria-label="Partager ma position GPS" aria-checked="${!!u.gps}" onclick="gpsT(this)"></div></div>
 <label for="bx">Description des travaux</label><textarea id="bx" rows="3" placeholder="Décrivez le besoin"></textarea>
 <p class="mu" style="margin-bottom:10px">${mode=='devis'?'Le prestataire proposera un prix ; vous pourrez l\'accepter ou le refuser.':'Montant indicatif : dès '+money(p.tarif)+'. Le prestataire doit confirmer la réservation.'}</p>
 <button class="btn" onclick="createB(${pid},'${mode}')">${mode=='devis'?'Envoyer la demande':'Réserver'}</button>`)}
function createB(pid,mode){const p=PROS.find(x=>x.id==pid),d=$('#bd').value,a=$('#ba').value.trim(),x=$('#bx').value.trim(),s=$('#bs').value;
 if(!d)return toast('Choisissez une date');if(!a)return toast('Adresse requise');if(!x)return toast('Décrivez les travaux');
 S.bookings.unshift({id:Date.now(),pro:p.id,svc:s,date:d.replace('T',' '),addr:a,desc:x,mode,st:mode=='devis'?'demande_devis':'attente',price:mode=='devis'?0:p.tarif,rated:0});
 notify((mode=='devis'?'Demande de devis envoyée à ':'Réservation envoyée à ')+p.name);cm();S.tab='res';S.resSeg='en';save();main();toast('Demande envoyée')}

/* ---------- Réservations ---------- */
const BCARD=b=>{const p=PROS.find(x=>x.id==b.pro),s=BST[b.st];return `<div class="jc" role="button" tabindex="0" onclick="bdet(${b.id})"><div class="row sp" style="align-items:flex-start"><div style="min-width:0"><b style="font-size:15px">${esc(b.svc)}</b><div class="mu" style="margin-top:3px">${esc(p.name)} · ${esc(b.addr)}</div></div><b style="color:var(--or);font-size:14px;white-space:nowrap">${b.price?money(b.price):'À définir'}</b></div><div class="row sp" style="margin-top:10px"><span class="tag ${s[1]}">${s[0]}</span><span class="mu">${esc(b.date)}</span></div></div>`};
function resGroup(b){return ACTIVE.includes(b.st)?'en':(b.st=='terminee'?'ter':'ann')}
function res(){const g=S.resSeg||'en',L=S.bookings.filter(b=>resGroup(b)==g);
 $('#v').innerHTML=`<div class="top"><h2 style="font-size:24px">Mes réservations</h2></div><div class="body" style="padding-top:0"><div class="tabs2" role="tablist">${[['en','En cours'],['ter','Terminées'],['ann','Annulées']].map(x=>`<button role="tab" class="${g==x[0]?'on':''}" aria-selected="${g==x[0]}" onclick="S.resSeg='${x[0]}';save();res()">${x[1]}</button>`).join('')}</div>${L.map(BCARD).join('')||'<div class="card mu">Aucune réservation dans cette liste.</div>'}</div>`}
function bdet(id){const b=S.bookings.find(x=>x.id==id),p=PROS.find(x=>x.id==b.pro),s=BST[b.st],tx=S.tx.find(t=>t.bid==b.id);
 let act='';
 if(b.st=='devis_propose')act=`<div class="row" style="margin-top:12px"><button class="btn o" onclick="setB(${b.id},'refusee')">Refuser</button><button class="btn" onclick="setB(${b.id},'a_payer')">Accepter</button></div>`;
 else if(b.st=='a_payer')act=`<div class="row" style="margin-top:12px"><button class="btn g" onclick="setB(${b.id},'annulee')">Annuler</button><button class="btn" onclick="payM(${b.id})">Payer ${money(b.price)}</button></div>`;
 else if(b.st=='fin_signalee')act=`<div class="row" style="margin-top:12px"><button class="btn o" onclick="setB(${b.id},'litige')">Litige</button><button class="btn" onclick="setB(${b.id},'terminee')">Confirmer</button></div>`;
 else if(['attente','demande_devis','payee'].includes(b.st))act=`<button class="btn g" style="margin-top:12px" onclick="setB(${b.id},'annulee')">Annuler la réservation</button>`;
 const demo={attente:['Le prestataire accepte',`setB(${b.id},'a_payer')`],demande_devis:['Le prestataire envoie un devis de '+money(devisPrice(p)),`devisOffer(${b.id})`],payee:['Le prestataire démarre',`setB(${b.id},'en_cours')`],en_cours:['Le prestataire signale la fin',`setB(${b.id},'fin_signalee')`]}[b.st];
 const dm=demo?`<button class="btn dm" style="margin-top:8px" onclick="${demo[1]}">(Démo) ${demo[0]}</button>`:'';
 const receipt=tx?`<div class="card" style="margin-top:12px"><b>Reçu</b><div class="kv"><span>N°</span><b>${tx.id}</b></div><div class="kv"><span>Moyen</span><b>${esc(tx.m)}</b></div><div class="kv"><span>Montant</span><b>${money(tx.a)}</b></div><div class="kv"><span>Date</span><b>${tx.d}</b></div><div class="kv"><span>Statut</span><b>${esc(tx.s)}</b></div></div>`:'';
 const rev=b.st=='terminee'&&!b.rated?`<div class="card" style="margin-top:12px"><b>Votre avis</b><div style="margin:8px 0"><div class="mu" style="margin-bottom:2px" id="rnl">Touchez les étoiles pour noter</div><div class="stars-in" role="radiogroup" aria-label="Note sur 5 étoiles">${[1,2,3,4,5].map(n=>`<button type="button" role="radio" aria-checked="false" aria-label="${n} étoile${n>1?'s':''}" data-n="${n}" onclick="pickStar(${n})">★</button>`).join('')}</div><input type="hidden" id="rn" value=""></div><label for="rt">Commentaire</label><textarea id="rt" rows="2" placeholder="Votre expérience"></textarea><button class="btn" onclick="sendRev(${b.id})">Publier l'avis</button></div>`:'';
 const rv=b.rated?`<div class="card mu" style="margin-top:12px">Votre avis : <span class="stars">${'★'.repeat(b.rated)}</span></div>`:'';
 sub('Réservation',`<div class="bk"><div class="row sp"><b style="font-size:16px">${esc(p.name)}</b><span class="tag ${s[1]}">${s[0]}</span></div>
 <div class="kvs">${[['Service',b.svc],['Date',b.date],['Lieu',b.addr],['Type',b.mode=='devis'?'Demande de devis':'Réservation immédiate'],['Montant',b.price?money(b.price):'À définir']].map(x=>`<div class="kv2"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')}</div>
 <div class="kv2" style="border:0"><span>Description</span><b style="font-weight:500">${esc(b.desc)}</b></div></div>
 <div class="card mu">${NEXT[b.st]}</div>${act}${dm}${receipt}${rev}${rv}`,BACK_RES)}
function setB(id,st){const b=S.bookings.find(x=>x.id==id),old=b.st;b.st=st;
 if(st=='annulee'&&old=='payee'){const t=S.tx.find(x=>x.bid==b.id);if(t)t.s='Remboursement à traiter'}
 notify((MSG[st]||'Mise à jour')+(st=='annulee'&&old=='payee'?' · remboursement à traiter':''));save();bdet(id)}
function devisOffer(id){const b=S.bookings.find(x=>x.id==id),p=PROS.find(x=>x.id==b.pro);b.price=devisPrice(p);b.st='devis_propose';notify('Devis reçu de '+p.name+' : '+money(b.price));save();bdet(id)}
function payM(id){const b=S.bookings.find(x=>x.id==id);modal(`<h3>Paiement sécurisé</h3><p class="mu" style="margin:4px 0 12px">Montant : <b style="color:var(--or)">${money(b.price)}</b></p><label for="pm">Moyen de paiement</label><select id="pm">${PAY.map(m=>`<option>${m}</option>`).join('')}</select><p class="mu" style="margin-bottom:12px">Mode démonstration : aucun débit réel. En production, la confirmation vient du serveur du prestataire de paiement.</p><button class="btn" onclick="pay(${id})">Confirmer le paiement</button>`)}
function pay(id){const b=S.bookings.find(x=>x.id==id);if(b.st!='a_payer')return toast('Cette réservation ne peut pas être payée');if(S.tx.some(t=>t.bid==b.id))return toast('Paiement déjà enregistré');
 const m=$('#pm').value;S.tx.unshift({id:'TX'+Date.now().toString(36).toUpperCase(),bid:b.id,a:b.price,m,d:today(),s:'Réussi'});b.st='payee';notify('Paiement reçu : '+money(b.price));cm();save();bdet(id)}
function pickStar(n){$('#rn').value=n;document.querySelectorAll('.stars-in button').forEach(b=>{const on=+b.dataset.n<=n;b.classList.toggle('on',on);b.setAttribute('aria-checked',+b.dataset.n===n)});$('#rnl').textContent=n+' étoile'+(n>1?'s':'')+' sur 5'}
function sendRev(id){const b=S.bookings.find(x=>x.id==id),p=PROS.find(x=>x.id==b.pro),n=+$('#rn').value,t=$('#rt').value.trim();if(!n)return toast('Choisissez une note');if(!t)return toast('Ajoutez un commentaire');
 const nm=U().n.split(' ');(S.reviews[p.id]=S.reviews[p.id]||[]).unshift({n:nm[0]+' '+(nm[1]?nm[1][0]+'.':''),s:n,t});b.rated=n;notify('Merci pour votre avis');save();bdet(id)}

/* ---------- Messages ---------- */
let CT='',pend=null;
function chat(){const T=Object.keys(S.msgs).map(k=>{const p=k=='support'?null:PROS.find(x=>x.id==k),M=S.msgs[k];return {k,name:p?p.name:'Support Ouvrage',trade:p?p.trade:'Assistance',last:M[M.length-1]||{}}});
 $('#v').innerHTML=`<div class="top"><h2 style="font-size:24px">Messages</h2></div><div class="body" style="padding-top:0">${T.map(t=>`<div class="cr" role="button" tabindex="0" onclick="openChat('${t.k}')"><div class="av" style="width:50px;height:50px" aria-hidden="true">${t.k=='support'?'OU':ini(t.name)}</div><div style="flex:1;min-width:0"><div class="row sp"><b>${esc(t.name)}</b><span class="mu" style="font-size:11px">${t.last.h||''}</span></div><div class="row sp"><span class="mu ell">${t.last.img?'📷 Photo':esc(t.last.t||'')}</span>${S.unread[t.k]?`<span class="bd">${S.unread[t.k]}</span>`:''}</div></div></div>`).join('')}<p class="mu" style="margin-top:14px">Pour écrire à un prestataire, ouvrez son profil depuis l'accueil ou la recherche.</p></div>`}
function openChat(k){k=String(k);CT=k;S.unread[k]=0;save();const p=k=='support'?{name:'Support Ouvrage',trade:'Assistance'}:PROS.find(x=>x.id==k);
 go(`<div class="top"><button class="ib" aria-label="Retour" onclick="S.tab='chat';save();main()">‹</button><div class="av" style="width:40px;height:40px" aria-hidden="true">${k=='support'?'OU':ini(p.name)}</div><div style="flex:1;min-width:0"><b>${esc(p.name)}</b><div style="font-size:11px;color:var(--mu)">${esc(p.trade)}</div></div>${k=='support'?'':`<button class="ib" aria-label="Voir le profil" onclick="proView(${k})">👤</button>`}</div><div class="body" id="msgs"></div><div id="pv"></div><div class="ipill"><label class="ic" style="margin:0" aria-label="Joindre une photo">📎<input type="file" accept="image/*" hidden onchange="pick(this)"></label><input id="mi" aria-label="Message" placeholder="Écrivez un message…" onkeydown="if(event.key==='Enter')send()"><button class="ic" aria-label="Envoyer" onclick="send()" style="color:#fff;background:var(--or);border-radius:50%;width:34px;height:34px;padding:0">➤</button></div>`);draw()}
function draw(){const e=$('#msgs');if(!e)return;const M=S.msgs[CT]||[];e.innerHTML='<div class="dsep">Aujourd\'hui</div>'+M.map(m=>`<div class="bw ${m.m?'r':''}"><div class="bub ${m.m?'me':''}">${m.img?`<img src="${m.img}" alt="Photo envoyée">`:''}${m.t?esc(m.t):''}<small>${m.h}</small></div></div>`).join('');e.scrollTop=e.scrollHeight}
function pick(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>shrink(r.result,d=>{pend=d;$('#pv').innerHTML=`<div class="row" style="padding:8px 12px"><img src="${d}" alt="" style="height:60px;border-radius:10px"><span class="mu" style="flex:1">Aperçu avant envoi</span><button class="ib" aria-label="Retirer la photo" onclick="pend=null;$('#pv').innerHTML=''">✕</button></div>`});r.readAsDataURL(f)}
function shrink(src,cb){const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,800/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};im.src=src}
function send(){const t=$('#mi').value.trim();if(!t&&!pend)return;const k=CT;(S.msgs[k]=S.msgs[k]||[]).push({m:1,t,img:pend,h:time()});pend=null;$('#mi').value='';save();draw();
 setTimeout(()=>{const reply=k=='support'?'Notre équipe vous répond sous 24 h.':'Bien reçu, je vous réponds rapidement.';S.msgs[k].push({m:0,t:reply,h:time()});
  if($('#msgs')&&CT==k){draw()}else{S.unread[k]=(S.unread[k]||0)+1;notify('Nouveau message')}save()},1500)}

/* ---------- Profil ---------- */
function me(){const u=U(),fav=S.favs.length;
 const it=(i,t,s2,fn)=>`<div class="pr" role="button" tabindex="0" onclick="${fn}"><span class="pi" aria-hidden="true">${i}</span><div style="flex:1"><b style="font-size:14px">${t}</b><div class="ps">${s2}</div></div><span class="pc" aria-hidden="true">›</span></div>`;
 $('#v').innerHTML=`<div class="top"><h2 style="font-size:24px">Profil</h2><button class="ib" aria-label="Notifications" onclick="notifs()">🔔</button></div><div class="body" style="padding-top:0">
 <div class="row" style="margin-bottom:14px"><div class="av" style="width:60px;height:60px;font-size:20px">${ini(u.n)}</div><div style="flex:1;min-width:0"><b style="font-size:17px">${esc(u.n)}</b><div class="ps">${esc(u.contact)}</div><div class="mu">📍 ${esc(u.city)}${u.zone?' · '+esc(u.zone):''}</div></div></div>
 <div class="pcard">${it('♥','Mes favoris',fav+' prestataire(s)','favsV()')}${it('💳','Paiements et reçus',S.tx.length+' paiement(s)','paysV()')}${it('👤','Informations personnelles','Nom, ville, zone','edit()')}</div>
 <div class="pcard">${it('🆘','Assistance et litiges','Questions, signalements','support()')}${it('⚙️','Paramètres','Notifications, données, compte','settings()')}${it('🚪','Se déconnecter','','logout()')}</div></div>`}
function favsV(){const L=PROS.filter(p=>S.favs.includes(p.id));sub('Mes favoris',L.map(proCard).join('')||'<div class="card mu">Ajoutez des prestataires à vos favoris depuis leur profil.</div>',BACK_ME)}
function paysV(){sub('Paiements et reçus',S.tx.map(t=>`<div class="card row sp"><div><b>${money(t.a)}</b><div class="mu">${t.d} · ${esc(t.m)}</div></div><span class="tag t-ok">${esc(t.s)}</span></div>`).join('')||'<div class="card mu">Aucun paiement pour le moment.</div>',BACK_ME)}
function support(){sub('Assistance',`<div class="card"><b>Centre d'aide</b><div class="mu">Réponse sous 24 h.</div></div><label for="st">Type</label><select id="st"><option>Question</option><option>Litige sur une prestation</option><option>Problème de paiement</option><option>Signalement</option></select><label for="sm">Message</label><textarea id="sm" rows="4" placeholder="Décrivez votre demande"></textarea><button class="btn" onclick="sendSup()">Envoyer</button>`,BACK_ME)}
function sendSup(){const t=$('#sm').value.trim();if(!t)return toast('Décrivez votre demande');const ty=$('#st').value;S.msgs.support.push({m:1,t:ty+' : '+t,h:time()});S.unread.support=(S.unread.support||0)+1;notify('Demande envoyée au support');save();toast('Demande envoyée au support');S.tab='chat';main()}
function edit(){const u=U();sub('Informations personnelles',`<label for="x1">Nom</label><input id="x1" value="${esc(u.n)}"><label for="x2">Ville</label><select id="x2">${CITIES.map(c=>`<option ${u.city==c?'selected':''}>${c}</option>`).join('')}</select><label for="x3">Quartier / zone</label><input id="x3" value="${esc(u.zone||'')}"><button class="btn" onclick="saveEdit()">Enregistrer</button>`,BACK_ME)}
function saveEdit(){const u=U(),n=$('#x1').value.trim();if(!n)return toast('Le nom est requis');Object.assign(u,{n,city:$('#x2').value,zone:$('#x3').value.trim()});save();toast('Informations mises à jour');S.tab='me';main()}
function settings(){const u=U();sub('Paramètres',`<div class="card row sp"><span>Notifications push</span><div class="sw ${S.push===false?'':'on'}" role="switch" tabindex="0" aria-label="Notifications push" aria-checked="${S.push!==false}" onclick="tgl(this,'push')"></div></div>
 <div class="card row sp"><span>Langue</span><b>Français</b></div><div class="card row sp"><span>Devise</span><b>FCFA</b></div>
 <button class="btn g" onclick="toast('Export des données demandé')">Exporter mes données</button>
 <button class="btn r" style="margin-top:8px" onclick="if(confirm('Supprimer définitivement votre compte ?')){delete S.users[S.uid];S.uid=null;save();welcome()}">Supprimer mon compte</button>`,BACK_ME)}
function logout(){S.uid=null;save();welcome()}

splash();
</script></body></html>
