<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ouvrage — Administration</title><link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#0b0b0d;--side:#0f0f12;--card:#131316;--card2:#1b1b20;--ln:#24242b;--tx:#f4f4f6;--mu:#8e8e9a;--or:#ff6a13;--or2:#ff9a3d;--ok:#2ecc71;--ko:#ff4d4f;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100vh;overflow:hidden}
button,input{font:inherit}
.app{display:grid;grid-template-columns:260px 1fr;height:100vh}
aside{background:var(--side);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px;border-bottom:1px solid var(--ln)}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--or),#c24a05);display:grid;place-items:center;flex:none;box-shadow:0 10px 24px -10px #ff6a13aa}
.brand small{display:block;color:var(--mu);font-size:10px;letter-spacing:1.2px;font-weight:700}
.brand b{font-size:16px;letter-spacing:-.2px}
nav.side{flex:1;overflow-y:auto;padding:8px 12px 16px}
.grp{font-size:10.5px;letter-spacing:1.4px;color:#5d5d68;font-weight:700;margin:16px 10px 6px}
.item{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:none;border:0;color:#b9b9c4;cursor:pointer;text-align:left;font-size:14px}
.item:hover{background:var(--card2);color:var(--tx)}
.item.on{background:#ff6a1520;color:var(--or);font-weight:600}
.item i{width:22px;text-align:center;font-style:normal;font-size:16px}
.item[hidden]{display:none}
.me{border-top:1px solid var(--ln);padding:14px 16px;display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--or),#b43c00);display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:13px}
.me b{display:block}.me small{color:var(--mu);font-size:12px}
main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.top{display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--ln);background:var(--side)}
.crumb{color:var(--mu);font-size:14px;white-space:nowrap}.crumb b{color:var(--or);font-weight:600}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:0 12px;width:300px}
.search input{background:none;border:0;color:var(--tx);padding:10px 0;width:100%;outline:0}
.ibtn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--ln);color:var(--tx);cursor:pointer;font-size:16px;display:grid;place-items:center;flex:none;position:relative}
.menuBtn{display:none}
.content{flex:1;overflow-y:auto;padding:24px 28px 40px}
.head{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-size:26px;letter-spacing:-.5px}
.head p{color:var(--mu);margin-top:4px}
.sp{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:3px}
.seg button{background:none;border:0;color:var(--mu);padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--card2);color:var(--tx)}
.btn{background:linear-gradient(135deg,var(--or),var(--or2));border:0;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;box-shadow:0 10px 24px -12px #ff6a13aa}
.btn.g{background:var(--card);border:1px solid var(--ln);color:var(--tx);box-shadow:none}
.kpis,.fin{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.card{background:linear-gradient(180deg,#151518,#0e0e10);border:1px solid var(--ln);border-radius:18px;padding:18px;box-shadow:inset 0 1px 0 #ffffff08}
.lbl{font-size:11.5px;letter-spacing:1px;color:var(--mu);font-weight:700;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.val{font-size:30px;font-weight:800;letter-spacing:-.6px;margin-top:12px}
.val small{font-size:14px;color:var(--mu);font-weight:600;letter-spacing:0;margin-left:6px}
.sub{color:var(--mu);font-size:12.5px;margin-top:14px;padding-top:12px;border-top:1px solid var(--ln)}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}
.sec h2{font-size:15px;letter-spacing:-.2px}
.chart{width:100%;height:240px;margin-top:14px}
.empty{display:grid;place-items:center;text-align:center;color:var(--mu);border:1px dashed var(--ln);border-radius:14px;padding:24px;min-height:120px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--mu);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--ln);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.tbl td{padding:12px;border-bottom:1px solid var(--ln)}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card2);white-space:nowrap}
.placeholder ul{color:var(--mu);margin:10px 0 0 18px;line-height:1.8}
.np{position:absolute;right:28px;top:66px;width:320px;background:var(--card2);border:1px solid var(--ln);border-radius:16px;padding:16px;box-shadow:0 30px 60px -20px #000;z-index:30;display:none}
.np.open{display:block}
.toast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:13px;z-index:40;box-shadow:0 10px 30px -8px #000;white-space:nowrap}
.scrim{display:none;position:fixed;inset:0;background:#000a;z-index:15}
.scrim.open{display:block}
.t-or{background:#ff6a1322;color:var(--or)}.t-bl{background:#3b82f622;color:#3b82f6}.t-ok{background:#2ecc7122;color:var(--ok)}.t-ko{background:#ff4d4f22;color:var(--ko)}
.fld{width:100%;background:#121215;border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:11px;margin:4px 0 14px;font-size:14px}
.fld:focus{outline:0;border-color:var(--or);box-shadow:0 0 0 3px #ff6a1330}
label.l{font-size:12px;color:var(--mu);display:block}
.sw2{width:50px;height:28px;border-radius:99px;background:var(--card2);border:0;position:relative;cursor:pointer;flex:none}.sw2::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw2.on{background:var(--ok)}.sw2.on::after{left:25px}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:86vh;overflow:auto;background:var(--card2);border:1px solid var(--ln);border-radius:18px;padding:22px;z-index:40;box-shadow:0 30px 60px -20px #000}
.kv3{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:13.5px}.kv3 span{color:var(--mu)}.kv3 b{text-align:right}
.locked .app{grid-template-columns:1fr}
.locked aside,.locked .top,.locked .np,.locked .menuBtn{display:none!important}
.login{max-width:380px;margin:8vh auto;padding:26px}
.login .logo{margin:0 auto 14px}
.info{border:1px solid var(--ok);color:#b6f0cc;border-radius:12px;padding:10px 12px;margin-bottom:12px;background:#2ecc7114}
.alert{border:1px solid var(--ko);color:#ffb4b5;border-radius:12px;padding:10px 12px;margin-bottom:12px;background:#ff4d4f14}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:1200px){.kpis,.fin{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:820px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;inset:0 auto 0 0;width:260px;transform:translateX(-100%);transition:transform .25s;z-index:20}
 aside.open{transform:none}
 .menuBtn{display:grid}
 .search{display:none}
 .kpis,.fin{grid-template-columns:1fr}
 .content{padding:18px 16px 32px}
 .top{padding:12px 16px}
 .np{right:16px;left:16px;width:auto}
}
</style></head>
<body>
<div class="app">
 <aside id="side" aria-label="Navigation administrateur">
  <div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 48 48" width="24" height="24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 22 24 9l16 13"/><path d="M13 20v18h22V20"/><path d="M20 38v-9h8v9"/></svg></div><div><small>ADMINISTRATION</small><b>Ouvrage</b></div></div>
  <div style="padding:10px 12px 0"><div class="search" style="width:100%;margin:0"><input id="q" aria-label="Rechercher une rubrique" placeholder="Rechercher une rubrique…" oninput="filt(this.value)"></div></div>
  <nav class="side" id="nav"></nav>
  <div class="me"><div class="av" aria-hidden="true">OA</div><div><b>Administrateur</b><small>Ouvrage</small></div><button class="ibtn" style="margin-left:auto" aria-label="Se déconnecter" title="Se déconnecter" onclick="logout()">⏻</button></div>
 </aside>
 <div class="scrim" id="scrim" onclick="toggleSide(false)"></div>
 <main>
  <header class="top">
   <button class="ibtn menuBtn" aria-label="Ouvrir le menu" onclick="toggleSide(true)">☰</button>
   <div class="crumb" id="crumb"></div>
   <div class="search"><span aria-hidden="true">🔍</span><input aria-label="Recherche globale" placeholder="Rechercher une rubrique…" oninput="$('#q').value=this.value;filt(this.value)"></div>
   <button class="ibtn" aria-label="Notifications" aria-expanded="false" id="bell" onclick="notifsT()">🔔</button>
  </header>
  <div class="np" id="np" role="dialog" aria-label="Notifications"><b>Notifications</b><p class="sub" style="margin-top:10px;border:0;padding:0">Aucune notification pour le moment.</p></div>
  <div class="content" id="content"></div>
 </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/vendor/gsap/gsap.min.js"></script>
<script>
/* ---------- Animations (GSAP) : sobres, jamais bloquantes, désactivées si « réduire les animations » ---------- */
const RMQ=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
const anim={
 on(){return !!window.gsap&&!RMQ.matches},
 // Entrée d'une vue : blocs principaux, puis lignes, compteurs et graphiques
 view(el){if(!this.on()||!el)return;
  gsap.fromTo(el.children,{opacity:0,y:12},{opacity:1,y:0,duration:.4,ease:'power3.out',stagger:.05,overwrite:true,clearProps:'opacity,transform'});
  this.rows(el);el.querySelectorAll('[data-count]').forEach(x=>this.count(x,+x.dataset.count));this.bars(el)},
 // Cascade sur les lignes : plafonnée aux 15 premières pour les longues tables
 rows(el){if(!this.on()||!el)return;const L=[...el.querySelectorAll('tbody tr,.anim-row')].slice(0,15);if(!L.length)return;
  gsap.fromTo(L,{opacity:0,y:6},{opacity:1,y:0,duration:.3,ease:'power2.out',stagger:.03,delay:.12,overwrite:true,clearProps:'opacity,transform'})},
 // Compteur numérique : la valeur finale est toujours affichée, même si l'animation est interrompue
 count(el,v){if(!el)return;el.textContent=fmt(v);if(!this.on()||!(v>0))return;const o={n:0};
  gsap.to(o,{n:v,duration:.6,ease:'power2.out',onUpdate:()=>{el.textContent=fmt(o.n)},onComplete:()=>{el.textContent=fmt(v)}})},
 bars(el){if(!this.on()||!el)return;const B=el.querySelectorAll('.bar');
  if(B.length)gsap.fromTo(B,{scaleY:0},{scaleY:1,duration:.55,ease:'power3.out',stagger:.04,delay:.15,transformOrigin:'50% 100%'});
  const D=el.querySelectorAll('.donut');if(D.length)gsap.fromTo(D,{opacity:0,scale:.85,rotation:-30},{opacity:1,scale:1,rotation:0,duration:.6,ease:'power3.out',delay:.15,transformOrigin:'50% 50%'})},
 // Éléments centrés par translate(-50%,…) : GSAP prend la main sur le centrage (xPercent/yPercent)
 dlg(d,s){if(!this.on())return;d.style.transform='none';gsap.set(d,{xPercent:-50,yPercent:-50});
  gsap.fromTo(d,{opacity:0,y:14,scale:.97},{opacity:1,y:0,scale:1,duration:.3,ease:'power3.out'});if(s)gsap.fromTo(s,{opacity:0},{opacity:1,duration:.25,ease:'power2.out'});
  this.rows(d)},
 toastIn(e){if(!this.on())return;gsap.killTweensOf(e);e.style.transform='none';gsap.set(e,{xPercent:-50});gsap.fromTo(e,{opacity:0,y:12},{opacity:1,y:0,duration:.28,ease:'power2.out'})},
 toastOut(e){if(!this.on()){e.hidden=true;return}gsap.to(e,{opacity:0,y:8,duration:.2,ease:'power2.out',onComplete:()=>{e.hidden=true}})},
 // Écran de connexion : apparition de la carte, glissement lors du passage à l'étape du code
 login(f,step){if(!this.on()||!f)return;
  if(step)gsap.fromTo(f.querySelectorAll('.fld,label,.btn,p'),{opacity:0,x:step===2?18:-18},{opacity:1,x:0,duration:.35,ease:'power3.out',stagger:.03,clearProps:'opacity,transform'});
  else gsap.fromTo(f,{opacity:0,y:16},{opacity:1,y:0,duration:.5,ease:'power3.out',clearProps:'opacity,transform'})}
};
/* Rubriques du menu (ordre du cahier des charges) */
const GROUPS=[
 ['Menu principal',[['dash','Tableau de bord','📊'],['req','Demandes clients','📥'],['dist','Distribution automatique','🔀']]],
 ['Prestataires',[['pros','Prestataires','🛠️'],['valid','Validation des prestataires','🪪']]],
 ['Clients',[['cli','Clients','👥'],['sup','Support clients','💬']]],
 ['Missions et devis',[['res','Réservations et missions','📅'],['devis','Devis','🧾']]],
 ['Finances et litiges',[['fin','Finances et transactions','💳'],['com','Commissions','💰'],['ret','Retraits','🏦'],['lit','Litiges','⚖️']]],
 ['Rapports',[['rap','Rapports','📈'],['set','Paramètres','⚙️']]]
];
/* Rubriques non encore construites : étape du plan de travail */
const PAGES={
 valid:{step:3,title:'Validation des prestataires',desc:'Contrôle des pièces (carte d\'identité, extrait de naissance) avant visibilité.',items:['Dossiers en attente','Validation, refus ou demande de complément']},
 set:{step:null,title:'Paramètres',desc:'Réglages de l\'administration.',items:['Compte administrateur','Droits d\'accès par rôle']}
};
let P='dash',Q='';
const $=s=>document.querySelector(s);
const money=m=>new Intl.NumberFormat('fr-FR').format(Math.round(m)).replace(/\s/g,' ')+' FCFA';
const MOIS=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];

function renderNav(){
 const q=Q.toLowerCase();
 $('#nav').innerHTML=GROUPS.map(([g,items])=>`<div class="grp">${g.toUpperCase()}</div>`+items.map(([k,t,ic])=>`<button class="item ${P==k?'on':''}" ${t.toLowerCase().includes(q)?'':'hidden'} ${P==k?'aria-current="page"':''} onclick="go('${k}')"><i aria-hidden="true">${ic}</i>${t}</button>`).join('')).join('');
}
function filt(v){Q=v;renderNav()}
function toggleSide(o){$('#side').classList.toggle('open',o);$('#scrim').classList.toggle('open',o)}
function notifsT(){const n=$('#np'),o=!n.classList.contains('open');n.classList.toggle('open',o);$('#bell').setAttribute('aria-expanded',o);
 if(o&&anim.on()){gsap.fromTo(n,{opacity:0,y:-8},{opacity:1,y:0,duration:.25,ease:'power2.out',clearProps:'opacity,transform'});anim.rows(n)}}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;anim.toastIn(e);clearTimeout(toast.t);toast.t=setTimeout(()=>anim.toastOut(e),2200)}
// Changement de rubrique : seul cas (avec la connexion) où la vue est animée ; les rechargements après une action ne rejouent rien
function go(k){P=k;PK='tous';PQ='';renderNav();toggleSide(false);$('#np').classList.remove('open');render();anim.view($('#content'))}

function render(){
 if(P=='sup')return renderSupport();
 if(P=='req'||P=='dist')return renderOps();
 if(P=='ret')return renderRet();
 if(P=='lit')return renderLit();
 if(P=='rap')return renderRap();
 if(P=='fin'||P=='com')return renderFin(P);
 if(P=='res'||P=='devis')return renderMissions(P);
 if(P=='pros'||P=='cli')return renderPeople(P);
 if(P=='valid')return renderValid();
 if(P=='set')return renderSettings();
 const c=$('#content');
 if(P=='dash'){
  $('#crumb').innerHTML='Tableau de bord › <b>Vue générale</b>';
  const today=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const D=DB.dash,M6=D.monthly.reduce((a,m)=>a+m.paid,0);
  c.innerHTML=`
  <div class="head"><div><h1>Bienvenue, ${esc(DB.me.firstName||'Administrateur')}</h1><p>${today}</p></div>
   <div class="sp"><button class="btn g" onclick="exportCsv()">⬇ Exporter CSV</button></div></div>
  <div class="kpis">
   ${kpi('Clients inscrits',D.clients,'')}${kpi('Prestataires actifs',D.prosActive,'',D.prosPending?D.prosPending+' en attente de validation':'')}${kpi('Demandes reçues',D.requestsTotal,'',D.requestsOpen?D.requestsOpen+' ouvertes · '+D.requestsToDistribute+' à distribuer':'')}${kpi('Missions terminées',D.missionsDone,'',D.missionsOngoing?D.missionsOngoing+' en cours':'')}
  </div>
  <div class="sec"><h2>Suivi financier</h2></div>
  <div class="fin">
   ${kpi('Total payé par les clients',D.paid,'FCFA')}${kpi('Commissions Ouvrage',D.commissions,'FCFA')}${kpi('Sommes dues aux pros',D.dues,'FCFA')}${kpi('Versements effectués',D.payouts,'FCFA',D.withdrawalsPending?fmt(D.withdrawalsPending)+' FCFA de retraits en attente':'')}
  </div>
  <div class="two">
   <div class="card"><div class="lbl"><span>Tendance des ventes</span><span>Mensuel</span></div><div class="val"><span data-count="${M6}">${fmt(M6)}</span><small>FCFA</small></div><div class="sub" style="margin-top:6px;border:0;padding:0">Montants payés sur les 6 derniers mois</div>${trendSvg(D.monthly)}</div>
   <div class="card"><div class="lbl"><span>Répartition du chiffre d'affaires</span></div>${donut()}</div>
  </div>
  <div class="sec"><h2>Transactions récentes</h2></div>
  <div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>ID</th><th>Client</th><th>Prestataire</th><th>Service</th><th>Statut</th><th>Montant</th><th>Commission</th></tr></thead><tbody>${txRows()}</tbody></table></div></div>`;
 } else {
  const p=PAGES[P];
  $('#crumb').innerHTML=`Tableau de bord › <b>${p.title}</b>`;
  c.innerHTML=`<div class="head"><div><h1>${p.title}</h1><p>${p.desc}</p></div></div>
  <div class="card placeholder"><div class="lbl"><span>${p.step?'Étape '+p.step+' du plan de travail':'À préciser'}</span></div><div class="empty" style="margin-top:14px;min-height:160px"><div><b style="color:var(--tx);font-size:15px">Section à construire</b><ul style="text-align:left">${p.items.map(i=>`<li>${i}</li>`).join('')}</ul></div></div></div>`;
 }
}
function txRows(){const L=DB.missions.filter(m=>estPaye(m)||m.remboursement).sort((a,b)=>b.createdAt-a.createdAt).slice(0,8);
 return L.map(m=>`<tr><td>${esc(m.ref)}</td><td>${esc(m.client)}</td><td>${esc(m.pro)}</td><td>${esc(m.trade)}</td><td><span class="tag ${statutFin(m)[1]}">${statutFin(m)[0]}</span></td><td>${fmt(m.price||0)} FCFA</td><td>${fmt(comm(m))} FCFA</td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--mu);padding:30px">Aucune transaction pour le moment.</td></tr>'}
// Carte de chiffre : un nombre est formaté et animé (data-count) à l'entrée de la vue
function kpi(l,v,u,s){const n=typeof v==='number';return `<div class="card"><div class="lbl"><span>${l}</span></div><div class="val"><span${n?` data-count="${v}"`:''}>${n?fmt(v):v}</span>${u?`<small>${u}</small>`:''}</div><div class="sub">${s?esc(s):(v==0?'Aucune donnée pour le moment':'')}</div></div>`}
// Barres des 6 derniers mois (GET /dashboard → monthly) : payé par les clients et commissions
function trendSvg(monthly){
 const W=600,H=240,B=200,T=20,now=new Date(),months=[];
 for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
 const by=Object.fromEntries((monthly||[]).map(m=>[m.month,m])),max=Math.max(0,...months.map(k=>by[k]?by[k].paid:0));
 let g='';const top=max||1,cw=(W-40)/6,bw=Math.min(36,cw/3);
 for(let i=0;i<=4;i++){const y=T+(B-T)*i/4;g+=`<line x1="40" x2="${W}" y1="${y}" y2="${y}" stroke="#24242b" stroke-dasharray="3 4"/><text x="32" y="${y+4}" fill="#5d5d68" font-size="11" text-anchor="end">${i==4?'0':(max&&i==0?fmt(max/1000)+'k':'')}</text>`}
 months.forEach((k,i)=>{const x=40+i*cw+cw/2,m=by[k]||{paid:0,commissions:0},h1=(B-T)*m.paid/top,h2=(B-T)*m.commissions/top;

// Répartition par métier, calculée sur les réservations payées chargées (les 200 plus récentes par groupe)
function donut(){const C=['#ff6a13','#3b82f6','#2ecc71','#f5c542','#a855f7','#14b8a6','#ef4444','#8e8e9a'],by={};
 DB.missions.filter(aPayer).forEach(m=>{by[m.trade]=(by[m.trade]||0)+(m.price||0)});
 const L=Object.entries(by).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),tot=L.reduce((a,x)=>a+x[1],0),R=62,P2=2*Math.PI*R;let off=0;
 const segs=L.map(([t,v],i)=>{const len=P2*v/tot,s=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${C[i%C.length]}" stroke-width="18" stroke-dasharray="${len} ${P2-len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=len;return s}).join('');
 return `<div style="display:grid;place-items:center;margin:18px 0 6px"><svg viewBox="0 0 160 160" width="170" height="170" aria-hidden="true"><g class="donut"><circle cx="80" cy="80" r="${R}" fill="none" stroke="#24242b" stroke-width="18"/>${segs}</g><text x="80" y="78" text-anchor="middle" fill="#f4f4f6" font-size="15" font-weight="800">${fmt(tot)} FCFA</text><text x="80" y="98" text-anchor="middle" fill="#8e8e9a" font-size="11">par catégorie</text></svg></div>`+
  (L.length?L.map(([t,v],i)=>`<div class="kv3 anim-row"><span><span style="color:${C[i%C.length]}">●</span> ${esc(t)}</span><b>${money(v)}</b></div>`).join(''):'<div class="empty" style="min-height:70px">Aucune prestation payée pour le moment.</div>')}

async function reactiver(k,id){try{await api(`/users/${id}/reactivate`,'POST');closeDlg();toast('Compte réactivé');await loadAdmin();renderPeople(k)}catch(e){toast(e.message)}}
function ouvrirCompte(k,id){const x=listeOf(k).find(y=>y.id==id);if(!x)return;
 const lignes=isPro(k)
  ?[['Contact',x.contact],['Ville',x.city],['Métiers',x.trades.join(', ')],['Zones',x.zones.join(', ')],['Note',x.note?x.note.toFixed(1)+' / 5 ('+x.ratingCount+' avis)':'Aucun avis'],['Missions terminées',x.missions]]
  :[['Contact',x.contact],['Ville',x.city],['Zone',x.zone||'—'],['Demandes',x.requests],['Réservations',x.bookings]];
 dlg(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b style="font-size:17px">${esc(x.name)}</b><button class="ibtn" aria-label="Fermer" onclick="closeDlg()">✕</button></div>
 <div class="kv3"><span>Statut</span><b><span class="tag ${etat(k,x)[1]}">${etat(k,x)[0]}</span></b></div>
 ${lignes.map(l=>`<div class="kv3"><span>${l[0]}</span><b>${esc(l[1])}</b></div>`).join('')}
 ${x.suspended?`<p class="sub" style="border:0;padding:12px 0 0">Motif de suspension : ${esc(x.motif||'—')}</p><div style="margin-top:16px"><button class="btn" onclick="reactiver('${k}','${x.id}')">Réactiver le compte</button></div>`
  :`<label class="l" for="sm" style="margin-top:14px">Motif de suspension (obligatoire)</label><textarea class="fld" id="sm" rows="3"></textarea><div style="margin-top:6px"><button class="btn" style="background:var(--ko)" onclick="suspendre('${k}','${x.id}',$('#sm').value.trim())">Suspendre le compte</button></div>`}`)}
function tablePeople(k){
 const q=PQ.toLowerCase();
 const L=listeOf(k).filter(x=>(PK=='tous'||(PK=='actifs'&&estActif(k,x)&&!x.suspended)||(PK=='suspendus'&&x.suspended))&&[x.name,x.city||'',x.zone||'',(x.zones||[]).join(' '),(x.trades||[]).join(' ')].join(' ').toLowerCase().includes(q));
 const entete=isPro(k)?'<th>Prestataire</th><th>Métiers</th><th>Zone</th><th>Note</th><th>Statut</th><th></th>':'<th>Client</th><th>Contact</th><th>Ville</th><th>Inscrit le</th><th>Statut</th><th></th>';
 const ligne=x=>isPro(k)
  ?`<td>${esc(x.name)}</td><td>${esc((x.trades||[]).join(', '))}</td><td>${esc((x.zones||[]).join(', '))}</td><td>${x.note?x.note.toFixed(1):'—'}</td>`
  :`<td>${esc(x.name)}</td><td>${esc(x.contact||'')}</td><td>${esc(x.city||'')}</td><td>${esc(x.createdAt?new Date(x.createdAt).toLocaleDateString('fr-FR'):'')}</td>`;
 return `<div style="overflow-x:auto"><table class="tbl"><thead><tr>${entete}</tr></thead><tbody>${L.map(x=>`<tr>${ligne(x)}<td><span class="tag ${etat(k,x)[1]}">${etat(k,x)[0]}</span></td><td><button class="btn g" style="padding:7px 12px" onclick="ouvrirCompte('${k}','${x.id}')">Ouvrir</button></td></tr>`).join('')||`<tr><td colspan="6" style="text-align:center;color:var(--mu);padding:30px">${isPro(k)?'Aucun prestataire pour le moment.':'Aucun client inscrit pour le moment.'}</td></tr>`}</tbody></table></div>`}
function renderPeople(k){
 const pro=isPro(k),L=listeOf(k),titre=pro?'Prestataires':'Clients';
 $('#crumb').innerHTML=`Tableau de bord › <b>${titre}</b>`;
 const nb=f=>L.filter(f).length;
 $('#content').innerHTML=`<div class="head"><div><h1>${titre}</h1><p>${pro?'Profils, métiers et zones des prestataires. Suspension possible à tout moment.':'Comptes clients inscrits. Suspension possible à tout moment.'}</p></div></div>
 <div class="kpis" style="grid-template-columns:repeat(3,1fr)">${kpi(pro?'Prestataires actifs':'Clients actifs',nb(x=>estActif(k,x)&&!x.suspended),'')}${kpi('Suspendus',nb(x=>x.suspended),'')}${kpi('Total inscrits',L.length,'')}</div>
 <div class="row-f" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><div class="seg" role="tablist">${[['tous','Tous'],['actifs','Actifs'],['suspendus','Suspendus']].map(t=>`<button role="tab" aria-selected="${PK==t[0]}" class="${PK==t[0]?'on':''}" onclick="PK='${t[0]}';renderPeople('${k}')">${t[1]}</button>`).join('')}</div>
 <input class="fld" style="margin:0;max-width:320px" aria-label="Rechercher" placeholder="Rechercher un nom, une ville…" value="${esc(PQ)}" oninput="PQ=this.value;$('#ptab').innerHTML=tablePeople('${k}')"></div>
 <div class="card" style="padding:0;overflow:hidden"><div id="ptab">${tablePeople(k)}</div></div>`}
/* ---------- Étape 5 : réservations, missions et devis ---------- */
const MST={attente:['En attente de confirmation','t-or'],demande_devis:['Demande de devis','t-or'],devis_propose:['Devis proposé','t-bl'],a_payer:['À payer','t-or'],payee:['Payée','t-ok'],en_cours:['En cours','t-bl'],fin_signalee:['Fin à confirmer','t-or'],terminee:['Terminée','t-ok'],annulee:['Annulée','t-ko'],refusee:['Refusée','t-ko'],expiree:['Expirée','t-ko'],litige:['Litige','t-ko']};
const MGROUPE={en:['attente','demande_devis','devis_propose','a_payer','payee','en_cours','fin_signalee','litige'],ter:['terminee'],ann:['annulee','refusee','expiree']};
const MANNULABLE=['attente','demande_devis','devis_propose','a_payer','payee','en_cours'];
let MG='en';
// Annulation par l'administrateur : motif obligatoire, historisée ; une mission payée passe en remboursement à traiter
async function annulerMission(id,motif){try{await api(`/bookings/${id}/cancel`,'POST',{motif});closeDlg();toast('Mission annulée');await loadAdmin();renderMissions(P)}catch(e){toast(e.message)}}
function ouvrirMission(id){const m=DB.missions.find(x=>x.id==id);if(!m)return;
 const etapes=['Demande reçue','Prestataire confirmé','Payée','Travaux démarrés','Fin signalée','Confirmée par le client'];
 const rang={attente:0,demande_devis:0,devis_propose:1,a_payer:1,payee:2,en_cours:3,fin_signalee:4,litige:4,terminee:5};
 const r=rang[m.st];
 dlg(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b style="font-size:17px">Mission ${esc(m.ref)}</b><button class="ibtn" aria-label="Fermer" onclick="closeDlg()">✕</button></div>
 <div class="kv3"><span>Statut</span><b><span class="tag ${MST[m.st][1]}">${MST[m.st][0]}</span></b></div>
 ${[['Client',m.client],['Prestataire',m.pro],['Métier',m.trade],['Adresse',m.addr],['Créée le',m.date],['Date prévue',m.scheduled||'—'],['Type',m.mode=='devis'?'Devis':'Réservation immédiate'],['Montant',m.price?money(m.price):'À définir']].map(x=>`<div class="kv3"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}
 <div class="lbl" style="margin:16px 0 4px"><span>Avancement</span></div>
 ${etapes.map((e,i)=>`<div class="kv3"><span>${i+1}. ${e}</span><b style="color:${r!=null&&i<=r?'var(--ok)':'var(--mu)'}">${r!=null&&i<=r?'✔':'—'}</b></div>`).join('')}
 ${m.remboursement?'<p class="sub" style="border:0;color:var(--ko)">Remboursement à traiter (voir Finances).</p>':''}
 ${m.motif?`<p class="sub" style="border:0">Motif : ${esc(m.motif)}</p>`:''}
 ${MANNULABLE.includes(m.st)?`<label class="l" for="mm" style="margin-top:14px">Motif d'annulation (obligatoire)</label><textarea class="fld" id="mm" rows="2"></textarea><button class="btn" style="background:var(--ko)" onclick="annulerMission('${m.id}',$('#mm').value.trim())">Annuler la mission</button>`:''}`)}
function renderMissions(mode){
 const devis=mode=='devis';
 $('#crumb').innerHTML=`Tableau de bord › <b>${devis?'Devis':'Réservations et missions'}</b>`;
 const base=DB.missions.filter(m=>(m.mode=='devis')==devis);
 const L=base.filter(m=>MGROUPE[MG].includes(m.st)).sort((a,b)=>b.createdAt-a.createdAt);
 const nb=g=>base.filter(m=>MGROUPE[g].includes(m.st)).length;
 $('#content').innerHTML=`<div class="head"><div><h1>${devis?'Devis':'Réservations et missions'}</h1><p>${devis?'Demandes de devis, prix proposés et acceptations.':'Suivi des réservations immédiates, de l\'acceptation jusqu\'à la confirmation du client.'}</p></div></div>
 <div class="kpis" style="grid-template-columns:repeat(3,1fr)">${kpi('En cours',nb('en'),'')}${kpi('Terminées',nb('ter'),'')}${kpi('Annulées ou refusées',nb('ann'),'')}</div>
 <div class="seg" role="tablist" style="display:inline-flex;flex-wrap:wrap;margin-bottom:14px">${[['en','En cours'],['ter','Terminées'],['ann','Annulées ou refusées']].map(t=>`<button role="tab" aria-selected="${MG==t[0]}" class="${MG==t[0]?'on':''}" onclick="MG='${t[0]}';renderMissions('${mode}')">${t[1]} <span style="color:var(--mu)">${nb(t[0])}</span></button>`).join('')}</div>
 <div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Réf.</th><th>Client</th><th>Prestataire</th><th>Métier</th><th>Date</th><th>${devis?'Prix proposé':'Montant'}</th><th>Statut</th><th></th></tr></thead><tbody>${L.map(m=>`<tr><td>${esc(m.ref)}</td><td>${esc(m.client)}</td><td>${esc(m.pro)}</td><td>${esc(m.trade)}</td><td>${esc(m.date)}</td><td>${m.price?money(m.price):'—'}</td><td><span class="tag ${MST[m.st][1]}">${MST[m.st][0]}</span></td><td><button class="btn g" style="padding:7px 12px" onclick="ouvrirMission('${m.id}')">Ouvrir</button></td></tr>`).join('')||`<tr><td colspan="8" style="text-align:center;color:var(--mu);padding:30px">${devis?'Aucun devis dans cette liste.':'Aucune réservation dans cette liste.'}</td></tr>`}</tbody></table></div></div>`}
/* ---------- Étape 6 : finances, transactions et commissions ---------- */
const TRADES=['Plomberie','Électricité','Menuiserie','Peinture','Maçonnerie','Climatisation','Nettoyage','Autres services'];
const today=()=>new Date().toLocaleDateString('fr-FR');
const fmt=n=>new Intl.NumberFormat('fr-FR').format(Math.round(n)).replace(/\s/g,' ');
// Taux figé à l'acceptation du prix ; à défaut, taux courant de la catégorie (15 % de référence)
const taux=m=>m.taux!=null?m.taux:(DB.rates[m.trade]??15);
const comm=m=>Math.round((m.price||0)*taux(m)/100);
const net=m=>(m.price||0)-comm(m);
const estPaye=m=>['payee','en_cours','fin_signalee','terminee'].includes(m.st)||(m.st=='annulee'&&!!m.remboursement);
const aPayer=m=>estPaye(m)&&!m.rembourse;
const RET_ACT=['en_cours','verse'];
const prosNoms=()=>[...new Set([...DB.missions.map(m=>m.pro),...DB.retraits.map(r=>r.pro)])];
const soldeBrut=n=>DB.missions.filter(m=>m.pro==n&&m.st=='terminee').reduce((a,m)=>a+net(m),0);
const retire=n=>DB.retraits.filter(r=>r.pro==n&&RET_ACT.includes(r.st)).reduce((a,r)=>a+r.montant,0);
const soldeDispo=n=>soldeBrut(n)-retire(n);
function statutFin(m){if(m.rembourse)return['Remboursé','t-ok'];if(m.st=='annulee'&&m.remboursement)return['Remboursement à traiter','t-ko'];if(m.st=='terminee')return['Confirmée · disponible au retrait','t-ok'];return['Payé, travaux en cours','t-bl']}
let FF='tous';
async function rembourser(id){try{await api(`/bookings/${id}/refunded`,'POST');toast('Remboursement enregistré');await loadAdmin();renderFin('fin')}catch(e){toast(e.message)}}
function renderFin(k){
 if(k=='com')return renderCom();
 $('#crumb').innerHTML='Tableau de bord › <b>Finances et transactions</b>';
 const t=DB.dash;
 let L=DB.missions.filter(m=>estPaye(m)||m.remboursement);
 if(FF=='confirmees')L=L.filter(m=>m.st=='terminee');
 if(FF=='remb')L=L.filter(m=>m.remboursement||m.rembourse);
 $('#content').innerHTML=`<div class="head"><div><h1>Finances et transactions</h1><p>Paiements reçus, commissions et soldes des prestataires. Les versements se font par retrait.</p></div></div>
 <div class="fin">${kpi('Total payé par les clients',t.paid,'FCFA')}${kpi('Commissions Ouvrage',t.commissions,'FCFA')}${kpi('Soldes dus aux pros',t.dues,'FCFA')}${kpi('Versements effectués',t.payouts,'FCFA')}</div>
 <div class="seg" role="tablist" style="display:inline-flex;flex-wrap:wrap;margin-bottom:14px">${[['tous','Toutes'],['confirmees','Prestations confirmées'],['remb','Remboursements']].map(x=>`<button role="tab" aria-selected="${FF==x[0]}" class="${FF==x[0]?'on':''}" onclick="FF='${x[0]}';renderFin('fin')">${x[1]}</button>`).join('')}</div>
 ${FF=='remb'?refundsTable():`<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Réf.</th><th>Client</th><th>Prestataire</th><th>Montant</th><th>Commission</th><th>Part prestataire</th><th>Statut</th><th></th></tr></thead><tbody>${L.map(m=>{const s=statutFin(m);const act=(m.remboursement&&!m.rembourse)?`<button class="btn g" style="padding:7px 12px" onclick="rembourser('${m.id}')">Rembourser</button>`:'';
  return `<tr><td>${esc(m.ref)}</td><td>${esc(m.client)}</td><td>${esc(m.pro)}</td><td>${fmt(m.price||0)} FCFA</td><td>${fmt(comm(m))} FCFA <span style="color:var(--mu);font-size:12px">(${taux(m)} %)</span></td><td>${fmt(net(m))} FCFA</td><td><span class="tag ${s[1]}">${s[0]}</span></td><td>${act}</td></tr>`}).join('')||'<tr><td colspan="8" style="text-align:center;color:var(--mu);padding:30px">Aucune transaction pour le moment.</td></tr>'}</tbody></table></div></div>`}`}
// Remboursements (GET /refunds) : à effectuer, puis effectués
function refundsTable(){const RS={refund_pending:['Remboursement à traiter','t-ko'],refunded:['Remboursé','t-ok']};
 return `<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Réf.</th><th>Client</th><th>Montant</th><th>Moyen de paiement</th><th>Mis à jour le</th><th>Statut</th><th></th></tr></thead><tbody>${DB.refunds.map(r=>`<tr><td>${esc(r.ref)}</td><td>${esc(r.client)}</td><td>${money(r.amount)}</td><td>${esc(r.method)}</td><td>${esc(dateFr(r.date))}</td><td><span class="tag ${(RS[r.status]||['',''])[1]}">${esc((RS[r.status]||[r.status])[0])}</span></td><td>${r.status=='refund_pending'?`<button class="btn g" style="padding:7px 12px" onclick="rembourser('${r.bookingId}')">Marquer remboursé</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--mu);padding:30px">Aucun remboursement.</td></tr>'}</tbody></table></div></div>`}
function renderCom(){
 $('#crumb').innerHTML='Tableau de bord › <b>Commissions</b>';
 $('#content').innerHTML=`<div class="head"><div><h1>Commissions</h1><p>Taux de commission par catégorie de métier. Le taux est figé quand le prix est accepté : une modification ne touche pas les missions déjà conclues.</p></div></div>
 <div class="two"><div class="card"><div class="lbl"><span>Taux par catégorie</span></div>
 <div style="margin-top:12px">${TRADES.map(t=>`<div class="kv3" style="align-items:center"><span style="color:var(--tx)">${esc(t)}</span><span style="display:flex;align-items:center;gap:8px"><input class="fld" style="width:90px;margin:0" type="number" min="0" max="50" step="0.5" aria-label="Taux ${esc(t)}" data-trade="${esc(t)}" value="${DB.rates[t]??15}"> %</span></div>`).join('')}</div>
 <button class="btn" style="margin-top:14px" onclick="saveTaux()">Enregistrer les taux</button></div>
 <div class="card"><div class="lbl"><span>Exemple de répartition</span></div><div style="margin-top:12px"><div class="kv3"><span>Montant payé par le client</span><b>50 000 FCFA</b></div><div class="kv3"><span>Commission Ouvrage (15 %)</span><b>7 500 FCFA</b></div><div class="kv3"><span>Part du prestataire (85 %)</span><b>42 500 FCFA</b></div></div>
 <div class="sec" style="margin-top:18px"><h2>Historique des taux</h2></div>${DB.rateHist.map(h=>`<div class="kv3 anim-row"><div><b>${esc(h.trade)}</b><div style="color:var(--mu);font-size:12.5px">${h.from==null?'—':esc(h.from)+' %'} → ${esc(h.to)} %</div></div><span style="color:var(--mu);font-size:12px;white-space:nowrap">${esc(new Date(h.date).toLocaleString('fr-FR'))}</span></div>`).join('')||'<div class="empty" style="min-height:70px">Aucune modification de taux.</div>'}</div></div>`}
async function saveTaux(){const rates=[];document.querySelectorAll('input[data-trade]').forEach(i=>{const t=i.dataset.trade,v=+i.value;if(v!==(DB.rates[t]??15))rates.push({trade:t,rate:v})});
 if(!rates.length)return toast('Aucun changement');
 try{await api('/rates','PUT',{rates});await loadAdmin();toast(`${rates.length} taux modifié(s)`);renderCom()}catch(e){toast(e.message)}}
/* ---------- Étape 7 : retraits, litiges et rapports ---------- */
const RST={demande:['Demandé','t-or'],en_cours:['En cours de virement','t-bl'],verse:['Viré','t-ok'],rejete:['Rejeté','t-ko']};
let RTF='demande';
// Retrait : le montant ne peut pas dépasser le solde ; il est bloqué dès la demande
async function retraitAction(id,action,motif){const path={encours:'start',verse:'paid',rejete:'reject'}[action];if(!path)return;
 try{await api(`/withdrawals/${id}/${path}`,'POST',action==='rejete'?{motif}:undefined);closeDlg();toast('Retrait mis à jour');await loadAdmin();renderRet()}catch(e){toast(e.message)}}
function ouvrirRetrait(id){const r=DB.retraits.find(x=>x.id==id);if(!r)return;
 dlg(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b style="font-size:17px">Retrait ${esc(r.ref)}</b><button class="ibtn" aria-label="Fermer" onclick="closeDlg()">✕</button></div>
 ${[['Prestataire',r.pro],['Montant',fmt(r.montant)+' FCFA'],['Moyen',r.moyen],['Numéro ou compte',r.numero],['Demandé le',r.date],['Solde disponible',fmt(Math.max(0,soldeDispo(r.pro)))+' FCFA'],['Statut',RST[r.st][0]]].map(x=>`<div class="kv3"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}
 ${r.st=='demande'?`<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn" onclick="retraitAction('${r.id}','encours')">Lancer le virement</button></div>`:''}
 ${r.st=='en_cours'?`<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn" onclick="retraitAction('${r.id}','verse')">Marquer comme viré</button></div>`:''}
 ${['demande','en_cours'].includes(r.st)?`<label class="l" for="rm" style="margin-top:14px">Motif de rejet (obligatoire pour rejeter)</label><textarea class="fld" id="rm" rows="2"></textarea><button class="btn" style="background:var(--ko)" onclick="retraitAction('${r.id}','rejete',$('#rm').value.trim())">Rejeter le retrait</button>`:''}`)}
function renderRet(){
 $('#crumb').innerHTML='Tableau de bord › <b>Retraits</b>';
 const nb=s=>DB.retraits.filter(r=>r.st==s).length;
 const L=DB.retraits.filter(r=>r.st==RTF).sort((a,b)=>b.createdAt-a.createdAt);
 $('#content').innerHTML=`<div class="head"><div><h1>Retraits</h1><p>Demandes de retrait des prestataires. Le solde est vérifié au lancement du virement.</p></div></div>
 <div class="kpis" style="grid-template-columns:repeat(3,1fr)">${kpi('Demandés',nb('demande'),'')}${kpi('En cours de virement',nb('en_cours'),'')}${kpi('Virés',nb('verse'),'')}</div>
 <div class="seg" role="tablist" style="display:inline-flex;flex-wrap:wrap;margin-bottom:14px">${Object.keys(RST).map(k=>`<button role="tab" aria-selected="${RTF==k}" class="${RTF==k?'on':''}" onclick="RTF='${k}';renderRet()">${RST[k][0]} <span style="color:var(--mu)">${nb(k)}</span></button>`).join('')}</div>
 <div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Réf.</th><th>Prestataire</th><th>Montant</th><th>Moyen</th><th>Demandé le</th><th>Statut</th><th></th></tr></thead><tbody>${L.map(r=>`<tr><td>${esc(r.ref)}</td><td>${esc(r.pro)}</td><td>${fmt(r.montant)} FCFA</td><td>${esc(r.moyen)}</td><td>${esc(r.date)}</td><td><span class="tag ${RST[r.st][1]}">${RST[r.st][0]}</span></td><td><button class="btn g" style="padding:7px 12px" onclick="ouvrirRetrait('${r.id}')">Ouvrir</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--mu);padding:30px">Aucun retrait dans cette liste.</td></tr>'}</tbody></table></div></div>`}

// Litige : l'administrateur tranche ; le remboursement ou le paiement au prestataire suit la décision
const LST={ouvert:['Ouvert','t-or'],resolu:['Résolu','t-ok']};
let LTF='ouvert';
async function trancher(id,dec,motif){try{await api(`/disputes/${id}/decide`,'POST',{decision:dec,motif});closeDlg();toast('Décision enregistrée');await loadAdmin();renderLit()}catch(e){toast(e.message)}}
function ouvrirLitige(id){const l=DB.litiges.find(x=>x.id==id);if(!l)return;
 dlg(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b style="font-size:17px">Litige ${esc(l.ref)}</b><button class="ibtn" aria-label="Fermer" onclick="closeDlg()">✕</button></div>
 ${[['Mission',l.mission],['Client',l.client],['Prestataire',l.pro],['Motif du litige',l.type],['Ouvert le',l.date],['Statut',LST[l.st][0]]].map(x=>`<div class="kv3"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}
 <p class="sub" style="border:0;padding:12px 0 0">${esc(l.description)}</p>
 ${l.st=='ouvert'?`<label class="l" for="lm" style="margin-top:14px">Motivation de la décision (obligatoire)</label><textarea class="fld" id="lm" rows="3"></textarea><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn g" onclick="trancher('${l.id}','client',$('#lm').value.trim())">Rembourser le client</button><button class="btn" onclick="trancher('${l.id}','pro',$('#lm').value.trim())">Confirmer la prestation</button></div>`:`<div class="kv3"><span>Décision</span><b>${l.decision=='client'?'Remboursement du client':'Prestation confirmée'}</b></div><p class="sub" style="border:0">${esc(l.motif||'')}</p>`}`)}
function renderLit(){
 $('#crumb').innerHTML='Tableau de bord › <b>Litiges</b>';
 const nb=s=>DB.litiges.filter(l=>l.st==s).length;
 const L=DB.litiges.filter(l=>l.st==LTF).sort((a,b)=>b.createdAt-a.createdAt);
 $('#content').innerHTML=`<div class="head"><div><h1>Litiges</h1><p>Contestations d'une prestation, annulations et remboursements. Chaque décision est motivée et historisée.</p></div></div>
 <div class="kpis" style="grid-template-columns:repeat(2,1fr)">${kpi('Ouverts',nb('ouvert'),'')}${kpi('Résolus',nb('resolu'),'')}</div>
 <div class="seg" role="tablist" style="display:inline-flex;margin-bottom:14px">${Object.keys(LST).map(k=>`<button role="tab" aria-selected="${LTF==k}" class="${LTF==k?'on':''}" onclick="LTF='${k}';renderLit()">${LST[k][0]} <span style="color:var(--mu)">${nb(k)}</span></button>`).join('')}</div>
 <div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Réf.</th><th>Mission</th><th>Motif</th><th>Ouvert le</th><th>Statut</th><th></th></tr></thead><tbody>${L.map(l=>`<tr><td>${esc(l.ref)}</td><td>${esc(l.mission)}</td><td>${esc(l.type)}</td><td>${esc(l.date)}</td><td><span class="tag ${LST[l.st][1]}">${LST[l.st][0]}</span></td><td><button class="btn g" style="padding:7px 12px" onclick="ouvrirLitige('${l.id}')">Ouvrir</button></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--mu);padding:30px">Aucun litige dans cette liste.</td></tr>'}</tbody></table></div></div>`}

// Rapports : chiffres calculés à partir des données réelles
function renderRap(){
 $('#crumb').innerHTML='Tableau de bord › <b>Rapports</b>';
 const M=DB.missions,t=DB.dash;
 const lignes=DB.zones.map(z=>({z:z.zone,dem:z.requests,mis:z.completed,ca:z.revenue}));
 $('#content').innerHTML=`<div class="head"><div><h1>Rapports</h1><p>Activité par zone et par métier, à partir des comptes et des missions.</p></div><div class="sp"><button class="btn g" onclick="exportCsv()">⬇ Exporter CSV</button></div></div>

 <div class="two"><div class="card" style="padding:0;overflow:hidden"><div style="padding:16px 18px" class="lbl"><span>Par zone</span></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Zone</th><th>Demandes</th><th>Missions terminées</th><th>Chiffre d'affaires</th></tr></thead><tbody>${lignes.map(l=>`<tr><td>${esc(l.z)}</td><td>${l.dem}</td><td>${l.mis}</td><td>${fmt(l.ca)} FCFA</td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--mu);padding:30px">Aucune donnée pour le moment.</td></tr>'}</tbody></table></div></div>
 <div class="card"><div class="lbl"><span>Missions terminées par métier</span></div><div style="margin-top:10px">${TRADES.map(x=>`<div class="kv3"><span>${esc(x)}</span><b>${M.filter(m=>m.trade==x&&m.st=='terminee').length}</b></div>`).join('')}</div></div></div>`}
/* ---------- Support clients : fils de discussion et réponses ---------- */
// Chaque fil correspond à un client. Les données viennent du backend (GET /v1/admin/support/:userId) une fois l'administration connectée.
let SUP_SEL=null;
async function selectSupport(id){SUP_SEL=id;
 try{const d=await api('/support/'+id);const f=DB.support.find(x=>x.id==id);if(f)f.messages=d.items.map(m=>({sender:m.sender,body:m.body,date:new Date(m.date).toLocaleString('fr-FR')}))}catch(e){toast(e.message)}
 renderSupport()}
function renderSupport(){
 $('#crumb').innerHTML='Tableau de bord › <b>Support clients</b>';
 const fils=DB.support.slice().sort((a,b)=>b.lastAt-a.lastAt);
 if(!fils.some(f=>f.id==SUP_SEL))SUP_SEL=fils[0]?fils[0].id:null;
 const f=fils.find(x=>x.id==SUP_SEL);
 $('#content').innerHTML=`<div class="head"><div><h1>Support clients</h1><p>Messages envoyés par les clients et réponses de l'équipe Ouvrage. La réponse est aussi envoyée en notification au client.</p></div></div>
 <div class="two" style="grid-template-columns:minmax(220px,1fr) 2fr;align-items:start">
  <div class="card" style="padding:0;overflow:hidden">${fils.map(x=>`<div class="kv3" role="button" tabindex="0" aria-current="${x.id==SUP_SEL}" style="padding:12px 14px;cursor:pointer;${x.id==SUP_SEL?'background:#ff6a1520':''}" onclick="selectSupport('${x.id}')"><div><b>${esc(x.name)}</b><div class="mu" style="font-size:12px">${esc(x.last)}</div></div>${x.awaiting?'<span class="tag t-or">À répondre</span>':''}</div>`).join('')||'<div class="empty" style="min-height:120px;border:0">Aucun message de client pour le moment.</div>'}</div>
  <div class="card">${f?`<div class="lbl"><span>${esc(f.name)}</span></div>
   <div style="margin:12px 0;display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto">${f.messages.map(m=>`<div style="align-self:${m.sender=='support'?'flex-end':'flex-start'};max-width:80%;background:${m.sender=='support'?'#ff6a13':'#1b1b20'};padding:9px 12px;border-radius:14px"><div style="white-space:pre-wrap">${esc(m.body)}</div><div style="font-size:11px;opacity:.7;margin-top:3px">${m.sender=='support'?'Équipe Ouvrage':'Client'} · ${esc(m.date)}</div></div>`).join('')}</div>
   <label class="l" for="supR">Votre réponse</label><textarea class="fld" id="supR" rows="3" maxlength="2000" placeholder="Écrivez votre réponse au client"></textarea>
   <button class="btn" onclick="repondreSupport('${f.id}')">Envoyer la réponse</button>`:'<div class="empty">Sélectionnez une conversation.</div>'}</div></div>`}
async function repondreSupport(id){const t=$('#supR').value.trim();if(!t)return toast('Écrivez une réponse');
 try{await api(`/support/${id}/messages`,'POST',{body:t});toast('Réponse envoyée');await selectSupport(id)}catch(e){toast(e.message)}}
/* ---------- Données : chargées depuis l'API à la connexion, rechargées après chaque action ---------- */
const ST_REQ=['nouvelle','distribuee','proposee','choisie','annulee','expiree'];
const dateFr=d=>new Date(d).toLocaleDateString('fr-FR');
async function loadAdmin(){
 const [reqs,pros,clients,bk,dis,ret,rates,sup,audit,refunds,dash,zones,me]=await Promise.all([
  Promise.all(ST_REQ.map(x=>api('/requests?status='+x))),
  api('/pros?status=tous'),api('/clients'),
  Promise.all(['en','ter','ann'].map(g=>api('/bookings?group='+g))),
  Promise.all(['ouvert','resolu'].map(x=>api('/disputes?status='+x))),
  Promise.all(['demande','en_cours','verse','rejete'].map(x=>api('/withdrawals?status='+x))),
  api('/rates'),api('/support'),api('/audit?limit=100'),api('/refunds'),api('/dashboard'),api('/reports/zones'),api('/me')]);
 const dt=d=>d?new Date(d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'';
 DB.reqs=reqs.flatMap(x=>x.items).map(r=>({id:r.id,ref:r.ref,client:r.client,trade:r.trade,title:r.title,desc:r.description,addr:r.address,zone:r.zone,urgency:r.urgency,desiredAt:dt(r.desiredAt),offers:r.offers||0,date:dateFr(r.date),st:r.status,sent:r.sent||[],createdAt:Date.parse(r.date)||0}));
 DB.pros=pros.items.map(p=>({id:p.id,name:p.name,city:p.city,contact:p.contact,trades:p.trades||[],zones:p.zones||[],verified:p.verification==='valide',dispo:p.available,note:p.rating||0,ratingCount:p.ratingCount||0,missions:p.missions||0,basePrice:p.basePrice||0,suspended:p.status==='suspended',status:p.verification,submittedAt:Date.parse(p.date)||0,dateFr:dateFr(p.date),docs:{cni:p.documents.includes('cni'),naiss:p.documents.includes('naiss'),diplome:p.documents.includes('diplome')},motif:''}));
 DB.clients=clients.items.map(c=>({id:c.id,name:c.name,city:c.city,contact:c.contact,zone:c.zone||'',requests:c.requests||0,bookings:c.bookings||0,createdAt:Date.parse(c.date)||0,suspended:c.status==='suspended',motif:''}));
 const RB=Object.fromEntries(refunds.items.map(r=>[r.bookingId,r.status]));
 DB.missions=bk.flatMap(x=>x.items).map(b=>{const rf=RB[b.id]||b.payment;return {id:b.id,ref:b.ref,client:b.client,pro:b.pro,trade:b.trade,service:b.service,addr:b.address,scheduled:dt(b.scheduledAt),price:b.price||0,st:b.status,mode:b.mode,date:dateFr(b.date),createdAt:Date.parse(b.date)||0,taux:b.commissionRate??undefined,remboursement:rf==='refund_pending'||rf==='refunded',rembourse:rf==='refunded',motif:''}});
 DB.refunds=refunds.items;
 DB.litiges=dis.flatMap(x=>x.items).map(d=>({id:d.id,ref:'LIT-'+d.id,mission:d.ref,client:d.client,pro:d.pro,type:d.type,description:d.description,date:dateFr(d.date),createdAt:Date.parse(d.date)||0,st:d.status,decision:d.decision,motif:d.motif}));
 DB.retraits=ret.flatMap(x=>x.items).map(w=>({id:w.id,ref:w.ref,pro:w.pro,proId:w.proId,montant:w.amount,moyen:w.method,numero:w.number,st:w.status,motif:w.reason,date:dateFr(w.date),createdAt:Date.parse(w.date)||0}));
 DB.rates=Object.fromEntries(rates.items.map(r=>[r.trade,r.rate]));
 DB.rateHist=rates.history||[];
 DB.support=sup.items.map(t=>({id:t.id,name:t.name,last:t.last||'',awaiting:!!t.awaitingReply,count:t.messages||0,lastAt:Date.parse(t.date)||0,messages:(DB.support.find(o=>o.id==t.id)||{}).messages||[]}));
 const proName=id=>{const x=DB.pros.find(p=>String(p.id)===String(id));return x?x.name:'Prestataire #'+id};
 DB.journal=audit.items.map(a=>({when:new Date(a.date).toLocaleString('fr-FR'),pro:a.entity==='user'?proName(a.entityId):a.entity+' #'+a.entityId,by:a.actorName||'',action:a.action,motif:(a.meta&&a.meta.motif)||''}));
 DB.dash=dash;DB.zones=zones.items;DB.me=me;
 const ini=((me.firstName||'')[0]||'')+((me.lastName||'')[0]||'');
 $('.me .av').textContent=(ini||'OA').toUpperCase();$('.me b').textContent=[me.firstName,me.lastName].filter(Boolean).join(' ')||'Administrateur';$('.me small').textContent=me.contact||'Ouvrage';
 renderNotifs();
}
// Cloche : tâches en attente, tirées du tableau de bord et du support (pas de notifications admin côté serveur)
function renderNotifs(){const d=DB.dash;if(!d)return;
 const L=[[d.requestsToDistribute,'demande(s) à distribuer','dist'],[d.prosPending,'prestataire(s) à valider','valid'],[d.disputesOpen,'litige(s) ouvert(s)','lit'],[d.withdrawalsToProcess,'retrait(s) à traiter','ret'],[DB.refunds.filter(r=>r.status==='refund_pending').length,'remboursement(s) à effectuer','fin'],[DB.support.filter(x=>x.awaiting).length,'conversation(s) en attente de réponse','sup']].filter(x=>x[0]>0);
 $('#np').innerHTML='<b>À traiter</b>'+(L.length?L.map(x=>`<div class="kv3 anim-row" role="button" tabindex="0" style="cursor:pointer" onclick="${x[2]=='fin'?"FF='remb';":''}go('${x[2]}')"><span>${esc(x[1])}</span><b>${x[0]}</b></div>`).join(''):'<p class="sub" style="margin-top:10px;border:0;padding:0">Rien à traiter pour le moment.</p>');
 $('#bell').setAttribute('aria-label','Notifications'+(L.length?' : '+L.length+' rubrique(s) à traiter':''))}
function resetAdmin(){Object.assign(DB,{reqs:[],pros:[],clients:[],missions:[],rates:{},retraits:[],litiges:[],support:[],journal:[],refunds:[],rateHist:[],zones:[],me:{},dash:DASH0})}
function askMotif(title,hint,cb){dlg(`<b style="font-size:17px">${esc(title)}</b><p class="mu" style="margin:6px 0 12px">${esc(hint)}</p><textarea class="fld" id="am" rows="3" aria-label="Motif"></textarea><button class="btn" id="amok">Confirmer</button>`);
 $('#amok').onclick=async()=>{const v=$('#am').value.trim();if(!v)return toast('Motif requis');try{await cb(v)}catch(e){toast(e.message)}}}

/* ---------- Connexion : mot de passe, puis code de double authentification ---------- */
// Le tableau de bord est servi par le backend de l'administration (même domaine). Le jeton d'accès reste en mémoire ;
// le jeton de rafraîchissement est dans la session du navigateur, effacé à la fermeture de l'onglet.
const API='/api/v1/admin';
let TOK=null;
let LOGIN={contact:'',password:'',step:1},LOGIN_SHOWN=0;
async function apiRaw(path,method='GET',body){const h={'Content-Type':'application/json'};if(TOK)h.Authorization='Bearer '+TOK;
 const r=await fetch(API+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body),credentials:'same-origin'});
 const data=r.status===204?null:await r.json().catch(()=>null);return {ok:r.ok,status:r.status,data}}
const msgOf=d=>(d&&d.error&&d.error.message)||'Une erreur est survenue';
function keepSession(d){TOK=d.accessToken;sessionStorage.setItem('ouv-admin-rt',d.refreshToken)}
async function renew(){const rt=sessionStorage.getItem('ouv-admin-rt');if(!rt)return false;
 const r=await apiRaw('/auth/refresh','POST',{refreshToken:rt}).catch(()=>null);
 if(!r||!r.ok){sessionStorage.removeItem('ouv-admin-rt');TOK=null;return false}keepSession(r.data);return true}
async function api(path,method,body){let r=await apiRaw(path,method,body);if(r.status===401&&await renew())r=await apiRaw(path,method,body);
 if(!r.ok)throw new Error(msgOf(r.data));return r.data}

// Pas d'inscription en ligne : les comptes administrateur se créent sur le serveur (npm run create-admin)
function showLogin(msg,ok){document.body.classList.add('locked');
 $('#content').innerHTML=`<form class="card login" onsubmit="return submitLogin(event)" autocomplete="on">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 48 48" width="24" height="24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 22 24 9l16 13"/><path d="M13 20v18h22V20"/><path d="M20 38v-9h8v9"/></svg></div>
  <h1 style="font-size:22px;text-align:center">Administration Ouvrage</h1>
  <p class="mu" style="text-align:center;margin:6px 0 18px">Accès réservé aux administrateurs.</p>
  ${msg?`<div class="${ok?'info':'alert'}" role="${ok?'status':'alert'}">${esc(msg)}</div>`:''}
  ${LOGIN.step===1
    ?`<label class="l" for="lg-c">Adresse e-mail</label><input class="fld" id="lg-c" type="email" autocomplete="username" required value="${esc(LOGIN.contact)}">
      <label class="l" for="lg-p">Mot de passe</label><input class="fld" id="lg-p" type="password" autocomplete="current-password" required>`
    :`<p class="mu" style="margin-bottom:10px">Saisissez le code à 6 chiffres de votre application d'authentification.</p>
      <label class="l" for="lg-t">Code de vérification</label><input class="fld" id="lg-t" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>`}
  <button class="btn" id="lg-btn" type="submit">${LOGIN.step===1?'Continuer':'Se connecter'}</button>
  ${LOGIN.step===2?'<button type="button" class="btn g" style="margin-top:8px" onclick="LOGIN.step=1;showLogin()">Retour</button>':''}
  ${LOGIN.step===1?'<p class="mu" style="text-align:center;margin-top:14px;font-size:12.5px">Pas de compte ? Les comptes administrateur sont créés sur le serveur avec <code>npm run create-admin</code>.</p>':''}
 </form>`;
 // Animation : carte à la première apparition, glissement au changement d'étape, rien sur un simple message d'erreur
 const f=$('#content form');if(!LOGIN_SHOWN)anim.login(f);else if(LOGIN_SHOWN!==LOGIN.step)anim.login(f,LOGIN.step);LOGIN_SHOWN=LOGIN.step;
 const first=document.querySelector('#lg-c,#lg-t');if(first)first.focus()}

async function submitLogin(e){e.preventDefault();const btn=$('#lg-btn');btn.disabled=true;
 try{
  if(LOGIN.step===1){LOGIN.contact=$('#lg-c').value.trim();LOGIN.password=$('#lg-p').value;
   const r=await apiRaw('/auth/login','POST',{contact:LOGIN.contact,password:LOGIN.password});
   if(!r.ok&&r.data&&r.data.error&&r.data.error.code==='mfa_required'){LOGIN.step=2;return showLogin()}
   if(!r.ok){LOGIN.password='';return showLogin(msgOf(r.data))}
   return finishLogin(r.data)}
  const r=await apiRaw('/auth/login','POST',{contact:LOGIN.contact,password:LOGIN.password,totp:$('#lg-t').value.trim()});
  if(!r.ok)return showLogin(msgOf(r.data));
  return finishLogin(r.data);
 }catch(err){showLogin('Serveur injoignable, réessayez')}
 return false}

async function finishLogin(d){keepSession(d);LOGIN={contact:'',password:'',step:1};LOGIN_SHOWN=0;document.body.classList.remove('locked');
 try{await loadAdmin()}catch(e){toast(e.message)}renderNav();render();anim.view($('#content'))}
async function logout(){const rt=sessionStorage.getItem('ouv-admin-rt');
 if(rt)await apiRaw('/auth/logout','POST',{refreshToken:rt}).catch(()=>null);
 sessionStorage.removeItem('ouv-admin-rt');TOK=null;LOGIN={contact:'',password:'',step:1};resetAdmin();showLogin()}
// Au chargement : session encore valide ? sinon page de connexion
async function boot(){if(await renew()){finishLogin({accessToken:TOK,refreshToken:sessionStorage.getItem('ouv-admin-rt')})}else showLogin()}
boot();
</script>
