<script>
const $=s=>document.querySelector(s),A=$('#app');
// Animations GSAP centralisées : sans GSAP ou si l'utilisateur réduit les animations, rien n'est animé (le contenu s'affiche tel quel)
const anim=(()=>{const RM=matchMedia('(prefers-reduced-motion: reduce)'),ok=()=>!!window.gsap&&!RM.matches,E='power2.out',C='transform,opacity';
 const sync=()=>document.documentElement.classList.toggle('gs',ok());sync();RM.addEventListener&&RM.addEventListener('change',sync);
 return {
  screen(el,dx=14){if(!ok()||!el)return;gsap.fromTo(el,{opacity:0,x:dx},{opacity:1,x:0,duration:.3,ease:E,clearProps:C})},
  list(el,sel='.body > *'){if(!ok()||!el)return;const L=[...el.querySelectorAll(sel)].slice(0,14);if(!L.length)return;gsap.fromTo(L,{opacity:0,y:10},{opacity:1,y:0,duration:.32,ease:E,stagger:.04,clearProps:C})},
  count(el,value){if(!el)return;const v=Math.round(+value||0);if(!ok()||!v){el.textContent=money(v);return}const o={v:0};gsap.to(o,{v,duration:.5,ease:E,onUpdate:()=>{el.textContent=money(o.v)},onComplete:()=>{el.textContent=money(v)}})},
  counts(root){if(root)root.querySelectorAll('[data-count]').forEach(e=>anim.count(e,e.dataset.count))},
  sheet(m){if(!ok()||!m)return;gsap.fromTo(m,{opacity:0},{opacity:1,duration:.2,ease:E,clearProps:'opacity'});gsap.fromTo(m.firstElementChild,{y:60,opacity:0},{y:0,opacity:1,duration:.35,ease:'power3.out',clearProps:C})},
  panel(m){if(!ok()||!m)return;gsap.fromTo(m.querySelector('.pn'),{x:-40,opacity:0},{x:0,opacity:1,duration:.3,ease:'power3.out',clearProps:C});gsap.fromTo(m.querySelector('.ov'),{opacity:0},{opacity:1,duration:.25,clearProps:'opacity'})},
  toastIn(e){if(!ok())return;gsap.fromTo(e,{opacity:0,y:12,xPercent:-50,x:0},{opacity:1,y:0,duration:.25,ease:E,clearProps:'transform'})},
  toastOut(e){if(!ok()||!e.isConnected)return e.remove();gsap.to(e,{opacity:0,duration:.2,ease:E,onComplete:()=>e.remove()})},
  hero(el){if(!ok()||!el)return;const tl=gsap.timeline({defaults:{ease:'power3.out'}});
   tl.fromTo(el,{opacity:0},{opacity:1,duration:.3,clearProps:'opacity'});
   const g=el.querySelectorAll('.obg,.glow');if(g.length)tl.fromTo(g,{opacity:0,scale:.94},{opacity:1,scale:1,duration:.5,clearProps:C},0);
   const t=el.querySelectorAll('.obh,.obt>*');if(t.length)tl.fromTo(t,{opacity:0,y:16},{opacity:1,y:0,duration:.4,stagger:.05,clearProps:C},.1)},
 }})();
// Interrupteurs et éléments [role=switch] activables au clavier (Entrée / Espace)
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=switch]')){e.preventDefault();e.target.click()}});
const CATS={'Bâtiment':['Maçon','Peintre','Carreleur','Plaquiste'],'Plomberie':['Plombier','Installateur sanitaire'],'Automobile':['Mécanicien','Électricien automobile','Diagnostic'],'Métallurgie':['Ferrailleur','Soudeur','Serrurier'],'Bois':['Menuisier','Ébéniste','Charpentier'],'Électricité':['Électricien','Technicien'],'Maison et entretien':['Ménage','Jardinage','Entretien'],'Technologie':['Informaticien','Réparateur informatique'],'Autres métiers':[]};
const CI={'Bâtiment':'🧱','Plomberie':'🚰','Automobile':'🚗','Métallurgie':'⚙️','Bois':'🪚','Électricité':'⚡','Maison et entretien':'🏡','Technologie':'💻','Autres métiers':'➕'};
let RS=[];
const CUR={code:'XOF',dec:0,loc:'fr-CI'}; // devise par pays, montants en unités mineures
const money=m=>new Intl.NumberFormat('fr-FR').format(Math.round(m/Math.pow(10,CUR.dec))).replace(/[\u202f\u00a0]/g,' ')+' FCFA';

const MN=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const phSvg=e=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2a22"/><stop offset="1" stop-color="#ff6a13"/></linearGradient></defs><rect width="200" height="140" fill="url(#g)"/><text x="100" y="92" font-size="60" text-anchor="middle">${e}</text></svg>`);
const def=()=>({user:null,users:{},session:false,tab:'home',avail:true,reqs:[],convs:[],wallet:{tx:[],pending:0},port:[],ver:{cni:'',diplome:'',naiss:'',st:'attente'},notif:[],theme:'dark'});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem('ouv-p')||'{}'))}catch(e){S=def()}
// Remise à zéro unique : suppression des anciennes données de démonstration

function port(){sub('Mon portfolio',`<button class="btn" onclick="addP()">＋ Ajouter une réalisation</button><br><br>${S.port.map((p,i)=>`<div class="card"><div class="ph">${p.b?`<div style="background-image:url(${p.b})"><span>Avant</span></div>`:''}${p.a?`<div style="background-image:url(${p.a})"><span>Après</span></div>`:''}</div><div class="row sp" style="margin-top:8px"><b>${esc(p.t)}</b><span class="tag">${p.v?'Public':'Privé'}</span></div><div class="mu">${esc(p.d)}</div><div class="row" style="margin-top:8px"><button class="btn s g" onclick="S.port[${i}].v=!S.port[${i}].v;save();port()">Visibilité</button><button class="btn s r" onclick="S.port.splice(${i},1);save();port()">Supprimer</button></div></div>`).join('')||'<div class="card mu">Montrez votre savoir-faire : ajoutez vos premières photos avant/après.</div>'}<p class="mu">Ne publiez pas l'adresse ni les coordonnées d'un client sans son accord.</p>`)}
let PI={};
function addP(){PI={};modal(`<h3>Nouvelle réalisation</h3><br><input id="pt" placeholder="Titre"><textarea id="pd" rows="2" placeholder="Description"></textarea><div class="row"><label class="btn g s" style="flex:1;text-align:center">📷 Avant<input type="file" accept="image/*" hidden onchange="pp(this,'b')"></label><label class="btn g s" style="flex:1;text-align:center">📷 Après<input type="file" accept="image/*" hidden onchange="pp(this,'a')"></label></div><p class="mu" id="pi" style="margin:8px 0">Aucune photo</p><button class="btn" onclick="if(!$('#pt').value)return toast('Titre requis');S.port.unshift({t:$('#pt').value,d:$('#pd').value,b:PI.b,a:PI.a,v:true});try{save()}catch(e){}cm();port()">Publier</button>`)}
function pp(i,k){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,500/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);PI[k]=c.toDataURL('image/jpeg',.7);$('#pi').textContent=(PI.b?'✔ Avant ':'')+(PI.a?'✔ Après':'')};im.src=r.result};r.readAsDataURL(f)}

/* ---------- Vérification ---------- */
function verif(){const v=S.ver,st={attente:['En attente de validation','t-wa'],valide:['Validé','t-ok'],refuse:['Refusé','t-ko'],complement:['Complément demandé','t-bl']}[v.st]||['En attente de validation','t-wa'];
 const f=(k,l)=>`<div class="card row sp"><div><b>${l}</b><div class="mu">${v[k]?'✔ '+esc(v[k]):'Non fourni'}</div></div><label class="btn s g" style="width:auto">${v[k]?'Remplacer':'Envoyer'}<input type="file" hidden accept="image/jpeg,image/png,application/pdf" onchange="uploadDoc('${k}',this)"></label></div>`;
 sub('Vérification',`<div class="card row sp"><div><b>Statut</b><div class="mu">Pièces chiffrées, utilisées uniquement pour la vérification.</div></div><span class="tag ${st[1]}">${st[0]}</span></div>${f('cni',"Carte d'identité (obligatoire)")}${f('naiss','Extrait de naissance (obligatoire)')}${f('diplome','Justificatif professionnel (facultatif)')}<p class="mu" style="margin:6px 0 12px">Votre profil n'est visible par les clients qu'après validation par l'administrateur.</p>`)}
async function uploadDoc(kind,input){const f=input.files[0];if(!f)return;const fd=new FormData();fd.append('kind',kind);fd.append('file',f);
 try{await api('/me/documents','POST',fd,true);await loadAll();toast('Pièce envoyée');verif()}catch(e){toast(e.message)}}
/* ---------- Liaison au backend prestataire (API Ouvrage Pro) ---------- */
// Même origine par défaut ; « ouv-api-pro » permet à l'app mobile de pointer vers le serveur
const API_BASE=(localStorage.getItem('ouv-api-pro')||'')+'/api/v1/pro';
let TOK=null;
async function apiRaw(path,method='GET',body,isForm){const h={};if(!isForm)h['Content-Type']='application/json';if(TOK)h.Authorization='Bearer '+TOK;
 const r=await fetch(API_BASE+path,{method,headers:h,body:isForm?body:(body===undefined?undefined:JSON.stringify(body))});
 const data=r.status===204?null:await r.json().catch(()=>null);return {ok:r.ok,status:r.status,data}}
const msgOf=d=>(d&&d.error&&d.error.message)||'Une erreur est survenue';
function keepSession(d){TOK=d.accessToken;localStorage.setItem('ouv-pro-rt',d.refreshToken)}
async function renew(){const rt=localStorage.getItem('ouv-pro-rt');if(!rt)return false;const r=await apiRaw('/auth/refresh','POST',{refreshToken:rt}).catch(()=>null);
 if(!r||!r.ok){localStorage.removeItem('ouv-pro-rt');TOK=null;return false}keepSession(r.data);return true}
async function api(path,method,body,isForm){let r=await apiRaw(path,method,body,isForm);if(r.status===401&&await renew())r=await apiRaw(path,method,body,isForm);
 if(!r.ok){const e=new Error(msgOf(r.data));e.status=r.status;e.code=r.data&&r.data.error&&r.data.error.code;throw e}return r.data}
// Statuts du serveur -> statuts de l'écran
const PMAP={attente:'attente',demande_devis:'devis',devis_propose:'devisprop',a_payer:'acceptee',payee:'confirmee',en_cours:'encours',fin_signalee:'aconfirmer',terminee:'terminee',annulee:'annulee',refusee:'refusee',expiree:'expiree',litige:'litige'};
ST.litige=['Litige','t-wa'];STC.litige='#ff4d4f';
// Catégories de l'écran -> métiers acceptés par le serveur
const TRADE_OF_CAT={'Bâtiment':'Maçonnerie','Plomberie':'Plomberie','Automobile':'Autres services','Métallurgie':'Autres services','Bois':'Menuiserie','Électricité':'Électricité','Maison et entretien':'Nettoyage','Technologie':'Autres services','Autres métiers':'Autres services'};
function tradeOf(spec){if(spec==='Peintre')return 'Peinture';const cat=Object.keys(CATS).find(c=>CATS[c].includes(spec));return TRADE_OF_CAT[cat]||'Autres services'}
// ProBooking -> réservation de l'écran ; net et commission viennent du serveur (null tant que non fixés)
const mapBk=b=>({id:b.id,ref:b.ref,client:b.clientName||'Client',title:b.service||b.trade,city:b.clientCity||'',addr:b.address||'',desc:b.description||'',
 slot:b.scheduledAt?new Date(b.scheduledAt).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'À définir',
 price:b.price,net:b.net,st:PMAP[b.status]||'attente',rate:b.commissionRate,type:b.trade,mode:b.mode,createdAt:b.createdAt,updatedAt:b.updatedAt});
async function loadAll(){const me=await api('/me');
 const [en,ter,ann]=await Promise.all(['en','ter','ann'].map(g=>api('/bookings?group='+g)));
 const [w,wd,nt,vf,inc]=await Promise.all([api('/wallet'),api('/wallet/withdrawals'),api('/notifications'),api('/me/verification'),api('/requests').catch(e=>{if(e.code==='not_verified')return null;throw e})]);
 S.user={n:me.firstName+' '+me.lastName,city:me.city,zone:me.zones.join(', '),sub:me.trades.join(', '),subs:me.trades,tarif:me.basePrice,bio:me.bio,
   rating:me.rating,ratingCount:me.ratingCount,contact:me.contact,verif:me.verificationStatus,available:me.available,photo:(S.user&&S.user.contact===me.contact&&S.user.photo)||undefined};
 S.avail=me.available;
 S.reqs=[...en.items,...ter.items,...ann.items].map(mapBk);
 S.balance=w;
 const yr=new Date().getFullYear();
 S.wallet={pending:w.upcoming,tx:ter.items.map(b=>{const m=mapBk(b),dt=new Date(b.updatedAt||b.createdAt);return {id:b.id,l:m.title+' — '+m.client,a:m.net||0,t:'credit',d:dt.toLocaleDateString('fr-FR'),cat:m.type||'Autre',mo:dt.getFullYear()===yr?dt.getMonth():-1}})};
 S.withdrawals=wd.items;
 S.notif=nt.items.map(n=>({t:n.title,h:new Date(n.date).toLocaleString('fr-FR'),body:n.body}));
 S.ver={st:vf.status,cni:vf.documents.cni?'reçu':'',naiss:vf.documents.naiss?'reçu':'',diplome:vf.documents.diplome?'reçu':''};
 S.incoming=inc?inc.items:[];S.notVerified=!inc;
 S.convs=S.reqs.map(r=>({id:r.id,name:r.client,role:'Client',msgs:[],un:0}));
 save()}
splash();
